<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Synthetic comparison of Realist and Impressionist scenes</title><desc id="d">Two-panel original schematic. The left panel shows two laborers bent over field work with heavy tools and plain surroundings. The right panel shows a railway platform, moving figures, steam, and broken strokes suggesting shifting light.</desc><rect width="960" height="520" fill="#f1eee6"/><line x1="480" y1="35" x2="480" y2="485" stroke="#555" stroke-width="3"/><text x="240" y="55" text-anchor="middle" font-family="serif" font-size="24">WORK A</text><text x="720" y="55" text-anchor="middle" font-family="serif" font-size="24">WORK B</text><path d="M30 420 Q160 380 290 410 T460 395" fill="none" stroke="#766b57" stroke-width="24"/><g stroke="#555" stroke-width="14" stroke-linecap="round"><circle cx="170" cy="245" r="24" fill="#666"/><path d="M170 270 L145 345 L115 405 M150 315 L220 350 M145 345 L190 405"/><circle cx="310" cy="235" r="24" fill="#666"/><path d="M310 260 L290 340 L265 405 M295 315 L350 365 M290 340 L335 410"/></g><g stroke="#6f7780" stroke-width="9" opacity=".75"><line x1="520" y1="400" x2="925" y2="400"/><line x1="540" y1="365" x2="900" y2="365"/><line x1="560" y1="155" x2="560" y2="415"/><line x1="835" y1="145" x2="835" y2="415"/><line x1="560" y1="155" x2="835" y2="145"/></g><rect x="650" y="285" width="180" height="75" rx="10" fill="#666"/><circle cx="690" cy="365" r="23" fill="#444"/><circle cx="790" cy="365" r="23" fill="#444"/><g fill="none" stroke="#aeb5b7" stroke-width="20" opacity=".7"><path d="M700 270 Q650 220 705 175"/><path d="M750 270 Q805 215 770 160"/><path d="M805 275 Q860 235 830 185"/></g><g stroke="#8a8175" stroke-width="8"><line x1="585" y1="245" x2="615" y2="310"/><line x1="625" y1="230" x2="655" y2="310"/><line x1="860" y1="240" x2="885" y2="315"/></g></svg>