<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Synthetic modernist fragmented composition</title><desc id="d">Original geometric still-life schematic in which a bottle, bowl, table edge, and paper-like forms are broken into overlapping angular planes shown from more than one viewpoint.</desc><rect width="960" height="520" fill="#ece9e1"/><rect x="120" y="390" width="720" height="24" transform="rotate(-3 480 402)" fill="#575757"/><polygon points="350,115 430,145 405,355 310,340" fill="#777"/><polygon points="430,145 495,115 480,325 405,355" fill="#5d5d5d"/><polygon points="315,190 390,120 450,205 380,275" fill="#aaa" opacity=".9"/><ellipse cx="590" cy="285" rx="120" ry="62" fill="none" stroke="#666" stroke-width="18" transform="rotate(12 590 285)"/><polygon points="505,210 625,145 710,260 585,325" fill="#8f8f8f" opacity=".75"/><polygon points="520,335 650,260 725,355 600,405" fill="#686868" opacity=".8"/><polygon points="200,250 320,205 365,315 245,350" fill="#b1b1b1"/><line x1="185" y1="210" x2="760" y2="365" stroke="#4f4f4f" stroke-width="9"/><line x1="245" y1="365" x2="720" y2="150" stroke="#777" stroke-width="8"/><path d="M725 115 L810 165 L760 245 L680 190 Z" fill="none" stroke="#555" stroke-width="12"/><text x="480" y="475" text-anchor="middle" font-family="sans-serif" font-size="19">ORIGINAL SYNTHETIC COMPOSITION — MULTIPLE ANGULAR VIEWPOINTS</text></svg>