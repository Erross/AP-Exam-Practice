<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">Synthetic language-family diffusion schematic</title>
<desc id="desc">An original practice diagram showing one broad language family branching through several migration paths into multiple regional language communities over time.</desc>
<rect width="800" height="480" fill="#f6f1e7"/>
<text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Illustrative Language-Family Diffusion</text>
<circle cx="160" cy="230" r="62" fill="#ddd2bf" stroke="#222" stroke-width="3"/>
<text x="160" y="224" text-anchor="middle" font-family="sans-serif" font-size="18">Earlier</text><text x="160" y="248" text-anchor="middle" font-family="sans-serif" font-size="18">community</text>
<path d="M222 210 C330 120 405 110 510 120" fill="none" stroke="#333" stroke-width="7"/>
<path d="M222 230 C340 230 420 230 545 230" fill="none" stroke="#333" stroke-width="7"/>
<path d="M220 252 C330 340 410 365 520 360" fill="none" stroke="#333" stroke-width="7"/>
<polygon points="510,120 482,105 487,136" fill="#333"/><polygon points="545,230 516,215 516,245" fill="#333"/><polygon points="520,360 490,347 495,377" fill="#333"/>
<rect x="525" y="78" width="205" height="82" rx="10" fill="#e7dfd0" stroke="#222" stroke-width="2"/><text x="628" y="113" text-anchor="middle" font-family="sans-serif" font-size="17">Regional languages</text><text x="628" y="137" text-anchor="middle" font-family="sans-serif" font-size="17">A, B, C</text>
<rect x="560" y="190" width="170" height="82" rx="10" fill="#e7dfd0" stroke="#222" stroke-width="2"/><text x="645" y="225" text-anchor="middle" font-family="sans-serif" font-size="17">Regional languages</text><text x="645" y="249" text-anchor="middle" font-family="sans-serif" font-size="17">D, E</text>
<rect x="535" y="318" width="195" height="82" rx="10" fill="#e7dfd0" stroke="#222" stroke-width="2"/><text x="632" y="353" text-anchor="middle" font-family="sans-serif" font-size="17">Regional languages</text><text x="632" y="377" text-anchor="middle" font-family="sans-serif" font-size="17">F, G, H</text>
<text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="15">Original synthetic practice schematic — not a historical map and not drawn to geographic scale</text>
</svg>