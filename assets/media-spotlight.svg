<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">A city newspaper and its readers</title>
  <desc id="desc">A newsroom places housing costs in the largest position on its front page while smaller stories cover transit, schools, and flooding; people nearby discuss housing costs.</desc>
  <rect x="1" y="1" width="898" height="498" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="55" font-size="17" font-weight="700" letter-spacing="1.5" fill="#64748b">DAILY NEWS • CITY EDITION</text>
    <path d="M70 72h760" stroke="#17365d" stroke-width="4"/>

    <g transform="translate(70 102)">
      <rect width="450" height="322" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
      <text x="225" y="41" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#17233a">THE METRO REPORT</text>
      <path d="M22 54h406" stroke="#94a3b8" stroke-width="2"/>
      <rect x="22" y="70" width="264" height="154" rx="4" fill="#e8eef5"/>
      <path d="M50 193V126h31v67M88 193V101h38v92M134 193v-48h30v48M172 193v-82h43v82M222 193v-59h35v59" fill="#9fb3c8"/>
      <path d="M42 193h225" stroke="#64748b" stroke-width="4"/>
      <text x="22" y="251" font-size="27" font-weight="800" fill="#17365d">HOUSING COSTS</text>
      <text x="22" y="280" font-size="17" fill="#475569">Rents rise for a third year</text>
      <path d="M22 295h264" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="307" y="70" width="121" height="62" rx="4" fill="#f1f5f9"/>
      <text x="367" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">TRANSIT</text>
      <text x="367" y="118" text-anchor="middle" font-size="14" fill="#64748b">Route changes</text>
      <rect x="307" y="143" width="121" height="62" rx="4" fill="#f1f5f9"/>
      <text x="367" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">SCHOOLS</text>
      <text x="367" y="191" text-anchor="middle" font-size="14" fill="#64748b">Board meeting</text>
      <rect x="307" y="216" width="121" height="62" rx="4" fill="#f1f5f9"/>
      <text x="367" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">FLOODING</text>
      <text x="367" y="264" text-anchor="middle" font-size="14" fill="#64748b">Plan delayed</text>
      <path d="M22 310h406" stroke="#cbd5e1" stroke-width="2"/>
    </g>

    <path d="M540 260h58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M583 248l17 12-17 12" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(625 113)">
      <path d="M0 22C0 10 10 0 22 0h157c12 0 22 10 22 22v63c0 12-10 22-22 22H73l-28 25 7-25H22C10 107 0 97 0 85z" fill="#e8eef5" stroke="#64748b" stroke-width="3"/>
      <text x="100" y="43" text-anchor="middle" font-size="17" font-weight="700" fill="#17365d">“Housing costs</text>
      <text x="100" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#17365d">keep climbing.”</text>
    </g>
    <g transform="translate(661 276)">
      <circle cx="35" cy="29" r="25" fill="#d19a70"/><path d="M0 128c5-50 15-74 35-74s30 24 35 74z" fill="#17365d"/>
      <circle cx="119" cy="29" r="25" fill="#8f624a"/><path d="M84 128c5-50 15-74 35-74s30 24 35 74z" fill="#8f1d2c"/>
      <circle cx="203" cy="29" r="25" fill="#c98a62"/><path d="M168 128c5-50 15-74 35-74s30 24 35 74z" fill="#496b46"/>
    </g>
    <path d="M737 271c-12 12-26 19-42 22M769 271c12 12 26 19 42 22" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
