<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">The shrinking news spotlight</title><desc id="desc">A news spotlight brightly illuminates Issue A while three other issue cards remain dim.</desc><rect width="900" height="430" rx="24" fill="#172235"/><path d="M92 76h210l-74 274h-62z" fill="#fff1ae" opacity=".9"/><rect x="75" y="48" width="250" height="70" rx="16" fill="#d5523a" transform="rotate(-8 200 83)"/><text x="200" y="92" text-anchor="middle" font-family="system-ui" font-size="27" font-weight="bold" fill="white">NEWS SPOTLIGHT</text><g font-family="system-ui" text-anchor="middle"><rect x="105" y="238" width="250" height="120" rx="14" fill="white" stroke="#d5523a" stroke-width="7"/><text x="230" y="292" font-size="32" font-weight="bold" fill="#17345f">ISSUE A</text><text x="230" y="327" font-size="20" fill="#53657a">repeated coverage</text><g opacity=".46"><rect x="410" y="258" width="130" height="90" rx="12" fill="#d7deea"/><text x="475" y="311" font-size="24" fill="#172235">ISSUE B</text><rect x="570" y="258" width="130" height="90" rx="12" fill="#d7deea"/><text x="635" y="311" font-size="24" fill="#172235">ISSUE C</text><rect x="730" y="258" width="130" height="90" rx="12" fill="#d7deea"/><text x="795" y="311" font-size="24" fill="#172235">ISSUE D</text></g></g><text x="635" y="190" text-anchor="middle" font-family="system-ui" font-size="25" fill="#b7c2d4">outside the beam of attention</text>
</svg>
