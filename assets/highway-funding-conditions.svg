<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Federal highway money offered to a state with conditions attached</title>
  <desc id="desc">A federal highway trust fund sends money toward a state transportation department, but a checklist between them lists three conditions the state must meet: setting the drinking age at 21, enforcing seatbelt use, and banning open alcohol containers in vehicles.</desc>
  <rect x="1" y="1" width="898" height="498" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="450" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#17365d">HIGHWAY TRUST FUND: ANNUAL STATE ALLOCATION</text>

    <g transform="translate(60 90)">
      <rect width="220" height="140" rx="10" fill="#17365d"/>
      <text x="110" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">FEDERAL</text>
      <text x="110" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">HIGHWAY TRUST FUND</text>
      <path d="M60 78h100" stroke="#bfdbfe" stroke-width="3"/>
      <text x="110" y="100" text-anchor="middle" font-size="30" font-weight="700" fill="#bfdbfe">$</text>
      <text x="110" y="122" text-anchor="middle" font-size="12" fill="#dbeafe">Annual apportionment</text>
    </g>

    <g transform="translate(340 100)">
      <rect width="220" height="120" rx="10" fill="#ffffff" stroke="#8f624a" stroke-width="3"/>
      <text x="110" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">CONDITIONS ATTACHED</text>
      <path d="M20 42h180" stroke="#cbd5e1" stroke-width="2"/>
      <g font-size="12.5" fill="#334155">
        <text x="20" y="64">☐ Drinking age of 21</text>
        <text x="20" y="86">☐ Seatbelt use law</text>
        <text x="20" y="108">☐ No open containers</text>
      </g>
    </g>

    <path d="M282 150h55" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M325 138l14 12-14 12" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M562 150h55" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M605 138l14 12-14 12" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(640 90)">
      <rect width="220" height="140" rx="10" fill="#eef5fb" stroke="#4d749f" stroke-width="3"/>
      <text x="110" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#17365d">STATE DEPARTMENT</text>
      <text x="110" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#17365d">OF TRANSPORTATION</text>
      <path d="M60 70h100" stroke="#94b3d1" stroke-width="2"/>
      <text x="110" y="100" text-anchor="middle" font-size="12" fill="#334155">Must comply to receive</text>
      <text x="110" y="118" text-anchor="middle" font-size="12" fill="#334155">the full allocation</text>
    </g>

    <g transform="translate(150 280)">
      <rect width="600" height="130" rx="10" fill="#fff7ed" stroke="#b96c2e" stroke-width="2"/>
      <text x="300" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3f13">IF THE STATE DOES NOT COMPLY</text>
      <text x="300" y="62" text-anchor="middle" font-size="13" fill="#7c3f13">A percentage of the state's federal highway funds for that year is withheld</text>
      <text x="300" y="86" text-anchor="middle" font-size="13" fill="#7c3f13">until the state legislature meets the listed conditions.</text>
    </g>

    <path d="M450 220v50" stroke="#64748b" stroke-width="3" stroke-dasharray="6 6"/>
  </g>
</svg>

