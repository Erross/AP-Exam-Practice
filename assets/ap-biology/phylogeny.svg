<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Relationships among five hypothetical species</title>
  <desc id="desc">A rooted cladogram in which A branches first, B branches next, C branches next, and D and E are sister taxa. Four derived characters are marked on successive shared ancestral branches.</desc>
  <rect width="900" height="500" rx="24" fill="#f8fafc"/>
  <g stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 255h110M180 190v230M180 420h580M180 190h140M320 140v200M320 340h440M320 140h140M460 80v180M460 260h300M460 80h140M600 40v80M600 40h160M600 120h160"/>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">
    <text x="790" y="49">D</text><text x="790" y="129">E</text><text x="790" y="269">C</text><text x="790" y="349">B</text><text x="790" y="429">A</text>
  </g>
  <g fill="#f59e0b" stroke="#92400e" stroke-width="2">
    <circle cx="125" cy="255" r="11"/><circle cx="250" cy="190" r="11"/><circle cx="390" cy="140" r="11"/><circle cx="530" cy="80" r="11"/>
  </g>
  <g fill="#78350f" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <text x="92" y="292">character 1</text><text x="215" y="226">character 2</text><text x="355" y="176">character 3</text><text x="495" y="116">character 4</text>
  </g>
  <path d="M70 468h120" stroke="#0f766e" stroke-width="5" marker-end="url(#a)"/>
  <text x="205" y="475" fill="#0f766e" font-family="Arial, sans-serif" font-size="18" font-weight="700">time</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#0f766e"/></marker></defs>
</svg>
