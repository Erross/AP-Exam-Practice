<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Initial reaction rate of enzyme E</title>
  <desc id="desc">A line graph compares reaction rate across five substrate concentrations with no inhibitor, inhibitor A, and inhibitor B.</desc>
  <rect width="900" height="560" rx="24" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="1"><path d="M110 450h680M110 350h680M110 250h680M110 150h680M110 50h680"/></g>
  <path d="M110 50v400h680" fill="none" stroke="#334155" stroke-width="4"/>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="18" text-anchor="end">
    <text x="96" y="456">0</text><text x="96" y="356">10</text><text x="96" y="256">20</text><text x="96" y="156">30</text><text x="96" y="56">40</text>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="150" y="482">0.5</text><text x="285" y="482">1.0</text><text x="420" y="482">2.0</text><text x="555" y="482">5.0</text><text x="690" y="482">10.0</text>
    <text x="450" y="530" font-size="21" font-weight="700">Substrate concentration (mM)</text>
  </g>
  <text transform="translate(32 250) rotate(-90)" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="21" font-weight="700">Initial rate (μmol min⁻¹)</text>
  <polyline points="150,370 285,310 420,230 555,140 690,130" fill="none" stroke="#2563eb" stroke-width="5"/>
  <polyline points="150,410 285,370 420,300 555,170 690,140" fill="none" stroke="#d97706" stroke-width="5"/>
  <polyline points="150,390 285,360 420,330 555,300 690,290" fill="none" stroke="#7c3aed" stroke-width="5"/>
  <g fill="#2563eb"><circle cx="150" cy="370" r="7"/><circle cx="285" cy="310" r="7"/><circle cx="420" cy="230" r="7"/><circle cx="555" cy="140" r="7"/><circle cx="690" cy="130" r="7"/></g>
  <g fill="#d97706"><circle cx="150" cy="410" r="7"/><circle cx="285" cy="370" r="7"/><circle cx="420" cy="300" r="7"/><circle cx="555" cy="170" r="7"/><circle cx="690" cy="140" r="7"/></g>
  <g fill="#7c3aed"><circle cx="150" cy="390" r="7"/><circle cx="285" cy="360" r="7"/><circle cx="420" cy="330" r="7"/><circle cx="555" cy="300" r="7"/><circle cx="690" cy="290" r="7"/></g>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700"><text x="735" y="92" fill="#2563eb">No inhibitor</text><text x="735" y="122" fill="#d97706">Inhibitor A</text><text x="735" y="152" fill="#7c3aed">Inhibitor B</text></g>
</svg>
