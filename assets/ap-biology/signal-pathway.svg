<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">A receptor-mediated response pathway</title>
  <desc id="desc">An extracellular ligand activates a membrane receptor. The receptor activates phosphorylated relay A, which activates phosphorylated enzyme B. One B-P produces many second-messenger C molecules that activate a response protein. A separate panel shows phosphatase-catalyzed conversion of A-P to A plus inorganic phosphate and B-P to B plus inorganic phosphate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#334155"/>
    </marker>
    <style>
      .main-arrow { stroke: #334155; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .node-label { font: 700 23px Arial, sans-serif; text-anchor: middle; }
      .reaction { font: 700 18px Arial, sans-serif; fill: #334155; text-anchor: middle; }
    </style>
  </defs>
  <rect width="900" height="520" rx="24" fill="#f8fafc"/>
  <rect x="0" y="132" width="900" height="46" fill="#bae6fd"/>
  <path d="M0 140h900M0 170h900" stroke="#0284c7" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="42" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">EXTRACELLULAR</text>
  <text x="42" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">CYTOSOL</text>

  <circle cx="112" cy="92" r="27" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <text x="112" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#451a03">L</text>
  <path d="M187 98c-30 0-42 28-42 56s12 56 42 56h36c30 0 42-28 42-56s-12-56-42-56h-9v34h-18V98z" fill="#38bdf8" stroke="#075985" stroke-width="4"/>
  <text x="205" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#075985">RECEPTOR</text>

  <circle cx="345" cy="255" r="45" fill="#c4b5fd" stroke="#6d28d9" stroke-width="4"/>
  <text class="node-label" x="345" y="263" fill="#3b0764">A–P</text>
  <circle cx="495" cy="255" r="45" fill="#fda4af" stroke="#be123c" stroke-width="4"/>
  <text class="node-label" x="495" y="263" fill="#4c0519">B–P</text>

  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="650" cy="216" r="20" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="650" y="223" font-size="18" fill="#14532d">C</text>
    <circle cx="690" cy="255" r="20" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="690" y="262" font-size="18" fill="#14532d">C</text>
    <circle cx="650" cy="294" r="20" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="650" y="301" font-size="18" fill="#14532d">C</text>
    <circle cx="610" cy="255" r="20" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="610" y="262" font-size="18" fill="#14532d">C</text>
    <rect x="744" y="215" width="120" height="80" rx="18" fill="#fde68a" stroke="#a16207" stroke-width="4"/>
    <text x="804" y="248" font-size="17" fill="#713f12">RESPONSE</text><text x="804" y="273" font-size="17" fill="#713f12">PROTEIN</text>
  </g>

  <path class="main-arrow" d="M136 106l33 20"/>
  <path class="main-arrow" d="M257 197l47 31"/>
  <path class="main-arrow" d="M390 255h55"/>
  <path class="main-arrow" d="M540 255h43"/>
  <path class="main-arrow" d="M712 255h30"/>

  <rect x="280" y="346" width="365" height="112" rx="16" fill="#eef2f7" stroke="#64748b" stroke-width="3"/>
  <text x="462" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">PHOSPHATASE-CATALYZED</text>
  <text x="462" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">DEPHOSPHORYLATION</text>
  <text class="reaction" x="462" y="421">A–P  →  A + Pᵢ</text>
  <text class="reaction" x="462" y="449">B–P  →  B + Pᵢ</text>
</svg>
