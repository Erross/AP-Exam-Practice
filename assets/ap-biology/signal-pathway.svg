<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">A receptor-mediated response pathway</title>
  <desc id="desc">A ligand activates a receptor, relay proteins, a second messenger, and a response protein. A phosphatase acts on relay components.</desc>
  <rect width="900" height="500" rx="24" fill="#f8fafc"/>
  <rect x="0" y="145" width="900" height="46" fill="#bae6fd"/>
  <path d="M0 153h900M0 183h900" stroke="#0284c7" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="45" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">EXTRACELLULAR</text>
  <text x="45" y="465" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#475569">CYTOSOL</text>
  <circle cx="128" cy="104" r="28" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <text x="128" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#451a03">L</text>
  <path d="M205 110c-30 0-42 28-42 56s12 56 42 56h36c30 0 42-28 42-56s-12-56-42-56h-9v34h-18v-34z" fill="#38bdf8" stroke="#075985" stroke-width="4"/>
  <text x="223" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#075985">RECEPTOR</text>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="365" cy="270" r="47" fill="#c4b5fd" stroke="#6d28d9" stroke-width="4"/><text x="365" y="278" font-size="25" fill="#3b0764">A</text>
    <circle cx="520" cy="270" r="47" fill="#fda4af" stroke="#be123c" stroke-width="4"/><text x="520" y="278" font-size="25" fill="#4c0519">B</text>
    <circle cx="683" cy="226" r="21" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="683" y="233" font-size="18" fill="#14532d">C</text>
    <circle cx="725" cy="270" r="21" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="725" y="277" font-size="18" fill="#14532d">C</text>
    <circle cx="683" cy="314" r="21" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="683" y="321" font-size="18" fill="#14532d">C</text>
    <circle cx="641" cy="270" r="21" fill="#86efac" stroke="#15803d" stroke-width="3"/><text x="641" y="277" font-size="18" fill="#14532d">C</text>
    <rect x="760" y="228" width="110" height="84" rx="18" fill="#fde68a" stroke="#a16207" stroke-width="4"/><text x="815" y="264" font-size="17" fill="#713f12">RESPONSE</text><text x="815" y="289" font-size="17" fill="#713f12">PROTEIN</text>
  </g>
  <g stroke="#334155" stroke-width="5" fill="none" marker-end="url(#a)">
    <path d="M152 118l35 21"/><path d="M275 210l50 32"/><path d="M412 270h58"/><path d="M567 270h45"/><path d="M746 270h12"/>
  </g>
  <rect x="362" y="365" width="165" height="58" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="444" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">PHOSPHATASE</text>
  <path d="M404 365l-22-49M486 365l22-49" stroke="#475569" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="580" y="370" font-family="Arial, sans-serif" font-size="16" fill="#64748b">removes phosphate groups</text>
