<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Frequency of allele R across generations</title><desc id="desc">A graph compares allele R frequency in treated and untreated insect populations over ten generations.</desc>
