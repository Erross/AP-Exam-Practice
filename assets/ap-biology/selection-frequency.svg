  <g fill="#334155" font-family="Arial" font-size="18" text-anchor="middle"><text x="140" y="472">0</text><text x="265" y="472">2</text><text x="390" y="472">4</text><text x="515" y="472">6</text><text x="640" y="472">8</text><text x="765" y="472">10</text><text x="450" y="520" font-size="21" font-weight="700">Generation</text></g>
  <text transform="translate(35 325) rotate(-90)" fill="#334155" font-family="Arial" font-size="21" font-weight="700">Frequency of allele R</text>
