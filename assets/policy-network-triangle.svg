<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">A recurring three-way exchange among a committee, an agency, and a trade group</title>
  <desc id="desc">A congressional subcommittee, a federal regulatory agency, and an industry trade association are shown exchanging favors in a closed loop: the subcommittee approves the agency's budget, the agency writes rules favorable to the industry, and the trade association provides campaign support to subcommittee members.</desc>
  <rect x="1" y="1" width="898" height="498" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="450" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#17365d">A RECURRING POLICY RELATIONSHIP</text>

    <g transform="translate(360 60)">
      <rect width="180" height="90" rx="10" fill="#17365d"/>
      <text x="90" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CONGRESSIONAL</text>
      <text x="90" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SUBCOMMITTEE</text>
      <text x="90" y="76" text-anchor="middle" font-size="11" fill="#bfdbfe">Oversees agency funding</text>
    </g>

    <g transform="translate(100 340)">
      <rect width="200" height="100" rx="10" fill="#eef5fb" stroke="#4d749f" stroke-width="3"/>
      <text x="100" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#17365d">FEDERAL</text>
      <text x="100" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#17365d">REGULATORY AGENCY</text>
      <text x="100" y="80" text-anchor="middle" font-size="11" fill="#334155">Writes industry rules</text>
    </g>

    <g transform="translate(600 340)">
      <rect width="200" height="100" rx="10" fill="#fff7ed" stroke="#b96c2e" stroke-width="3"/>
      <text x="100" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3f13">INDUSTRY TRADE</text>
      <text x="100" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3f13">ASSOCIATION</text>
      <text x="100" y="80" text-anchor="middle" font-size="11" fill="#7c3f13">Represents member firms</text>
    </g>

    <path d="M400 152C320 220 260 280 220 338" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="270" y="250" font-size="12" fill="#334155">approves agency budget</text>

    <path d="M300 380C400 400 500 400 598 385" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="425" font-size="12" fill="#334155">writes rules favorable to industry</text>

    <path d="M700 338C660 260 580 190 502 155" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="655" y="195" text-anchor="middle" font-size="12" fill="#334155">funds campaign</text>
    <text x="655" y="211" text-anchor="middle" font-size="12" fill="#334155">support</text>

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0 0l8 3-8 3z" fill="#64748b"/>
      </marker>
    </defs>
  </g>
</svg>

