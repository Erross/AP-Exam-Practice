name: Import Precalculus onto current main

on:
  push:
    branches:
      - release/ap-precalculus-2027

permissions:
  contents: write

jobs:
  import:
    if: contains(github.event.head_commit.message, '[run-precalc-import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/ap-precalculus-2027
      - name: Import preserved bank and patch current registry
        run: node tools/precalc-import-once.js
      - name: Commit imported course
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-precalculus.js tests/ap-precalculus.test.js tests/helpers.js js/subjects.js
          git commit -m "Import AP Precalculus bank onto current main"
          git push origin HEAD:release/ap-precalculus-2027
