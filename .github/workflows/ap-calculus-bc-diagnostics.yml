name: AP Calculus BC quality diagnostics
on:
  push:
    branches: [subject/ap-calculus-bc]
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Run Calculus BC quality diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-calculus-bc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/ap-calculus-bc-diagnostics.js
