name: Apply AP Art History UX repairs
on:
  push:
    branches: [subject/ap-art-history]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Add Art History naive-UX repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/ap-art-history-ux-repair.py
      - run: npm ci
      - run: npm run check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js js/catalog.js js/subjects.js style.css
          git commit -m "Improve AP Art History visual practice UX"
          git push origin HEAD:subject/ap-art-history
