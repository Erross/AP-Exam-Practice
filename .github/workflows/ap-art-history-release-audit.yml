name: AP Art History release audit
on:
  push:
    branches: [subject/ap-art-history]
jobs:
  audit:
    if: github.event.head_commit.message == 'Run AP Art History 5k release audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run release:audit -- --subject ap-art-history --trials 5000 --overlap-trials 5000
