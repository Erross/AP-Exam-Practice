name: AP Human Geography drawer contract cleanup
on:
  push:
    branches: [subject/ap-human-geography]
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[contract-aphug]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-human-geography
      - name: Use generic skill-count range contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/draw.js'); s=p.read_text()
          s=s.replace('const ranges = subject.sciencePracticeRanges || {};','const ranges = subject.skillCountRanges || subject.sciencePracticeRanges || {};')
          s=s.replace('subject.sciencePracticeRanges || subject.attributeRanges','subject.skillCountRanges || subject.sciencePracticeRanges || subject.attributeRanges')
          s=s.replace('science-practice, and attribute ranges','skill/practice, and attribute ranges')
          p.write_text(s)
          p=Path('js/subjects.js'); s=p.read_text()
          i=s.index('    id: "ap-human-geography",')
          j=s.index('    dataVar: "QUESTIONS_AP_HUMAN_GEOGRAPHY",',i)
          chunk=s[i:j]
          chunk=chunk.replace('sciencePracticeRanges:', 'skillCountRanges:')
          s=s[:i]+chunk+s[j:]
          p.write_text(s)
          p=Path('tests/ap-human-geography-draw.test.js'); s=p.read_text()
          marker='const skills={"1":[15,21],"2":[10,15],"3":[8,12],"4":[8,12],"5":[8,12]};\n'
          replacement=marker+'assert.deepEqual(subject.skillCountRanges,skills);\nassert.equal(subject.sciencePracticeRanges,undefined);\n'
          if marker not in s: raise SystemExit('Human Geography skill marker not found')
          p.write_text(s.replace(marker,replacement,1))
          Path('.github/workflows/aphug-contract-once.yml').unlink()
          PY
      - name: Commit contract cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use generic skill-count ranges for Human Geography"
          git push origin HEAD:subject/ap-human-geography
