name: Temporary APUSH release wiring
on:
  push:
    branches: [subject/ap-us-history]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[apush-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-us-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_wire-apush-release.js
      - run: |
          rm tools/_wire-apush-release.js .github/workflows/_wire-apush-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/ap-us-history-u*.js data/ap-us-history-coverage.js tools/_wire-apush-release.js .github/workflows/_wire-apush-release.yml
          git commit -m "Wire APUSH browser-effective draft [apush-wired]"
          git push origin HEAD:subject/ap-us-history
