name: Analyze Physics C Mechanics Bias
on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths: [.github/workflows/_bias_pcm.yml]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - name: Report option-length metrics
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}}; vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('data/ap-physics-c-mechanics.js','utf8'),sandbox);
          const bank=sandbox.window.QUESTIONS_AP_PHYSICS_C_MECHANICS;
          const wc=s=>s.trim().split(/\s+/).length;
          let cw=0,dw=0,unique=0,among=0; const keys=[0,0,0,0],rows=[];
          for(const q of bank){const lens=q.o.map(wc),ci=q.c[0],cl=lens[ci],ds=lens.filter((_,i)=>i!==ci),longest=Math.max(...lens),n=lens.filter(x=>x===longest).length;cw+=cl;dw+=ds.reduce((a,b)=>a+b,0);keys[ci]++;if(cl===longest&&n===1)unique++;if(cl===longest&&n<4)among++;rows.push({id:q.id,cl,davg:ds.reduce((a,b)=>a+b,0)/3,delta:cl-ds.reduce((a,b)=>a+b,0)/3,correct:q.o[ci]});}
          console.log(JSON.stringify({n:bank.length,correctAvg:cw/bank.length,distractorAvg:dw/(bank.length*3),ratio:(cw/bank.length)/(dw/(bank.length*3)),uniqueLongest:unique/bank.length,amongLongest:among/bank.length,keys},null,2));
          rows.sort((a,b)=>b.delta-a.delta).slice(0,30).forEach(r=>console.log(JSON.stringify(r)));
          NODE
      - run: rm .github/workflows/_bias_pcm.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/_bias_pcm.yml
          git commit -m "Remove one-time Physics C Mechanics bias workflow"
          git push
