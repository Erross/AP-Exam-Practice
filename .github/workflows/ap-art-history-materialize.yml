name: Materialize AP Art History draft
on:
  push:
    branches: [subject/ap-art-history]
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.head_commit.message == 'Materialize Art History draft assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/materialize-ap-art-history.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html js/subjects.js assets/ap-art-history
          git commit -m "Wire AP Art History draft and local image library"
          git push origin HEAD:subject/ap-art-history
