name: Temporary APUSH configurator
on:
  push:
    branches: [subject/ap-us-history]
permissions:
  contents: write
jobs:
  configure:
    if: ${{ !contains(github.event.head_commit.message, '[apush-configured]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-us-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_configure-apush.js
      - run: |
          rm tools/_configure-apush.js .github/workflows/_configure-apush.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/subjects.js tools/_configure-apush.js .github/workflows/_configure-apush.yml
          git commit -m "Configure APUSH verified draft metadata [apush-configured]"
          git push origin HEAD:subject/ap-us-history
