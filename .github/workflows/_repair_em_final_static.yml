name: Repair EM Final Static Gates
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_repair_em_final_static.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: python tools/_repair_em_final_static.py
      - run: rm tools/_repair_em_final_static.py .github/workflows/_repair_em_final_static.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair final E&M static quality gates"
          git push origin HEAD:subject/ap-physics-c-em
