name: AP Statistics Naive Fix Cycle 1
on:
  push:
    branches: [subject/ap-statistics]
    paths: [.github/workflows/apstats-naive-fix-cycle1.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-statistics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Apply clean-room duplicate and coverage fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/ap-statistics.js'); s=p.read_text()
          def edit_obj(qid, fn):
              global s
              pat=r'(\{\n    "id": "'+re.escape(qid)+r'"[\s\S]*?\n  \})'
              m=re.search(pat,s); assert m,qid
              old=m.group(1); new=fn(old); assert new!=old,qid
              s=s[:m.start(1)]+new+s[m.end(1):]
          def add_variant(qid,gid):
              def f(x):
                  assert '"stimulusGroupId"' not in x
                  if '"variantGroupId"' in x: return x
                  a='"statsSetType": "standalone"'; assert a in x
                  return x.replace(a,a+',\n    "variantGroupId": "'+gid+'"',1)
              edit_obj(qid,f)

          def rewrite_u218(x):
              x=re.sub(r'"q": ".*?",\n    "o": \[[\s\S]*?\n    \],\n    "c": \[[\s\S]*?\n    \],\n    "e": ".*?",',
              '"q": "A random variable X takes values 0, 2, and 5 with probabilities 0.50, 0.30, and 0.20. The mean is 1.6. What is the standard deviation of X?",\n    "o": [\n      "1.91",\n      "1.60",\n      "3.64",\n      "2.20"\n    ],\n    "c": [\n      0\n    ],\n    "e": "Using μ=1.6, the variance is 0.50(0−1.6)^2 + 0.30(2−1.6)^2 + 0.20(5−1.6)^2 = 3.64, so the standard deviation is √3.64 ≈ 1.91. The value 1.60 is the mean, while 3.64 is the variance rather than the standard deviation.",',x,count=1)
              return x
          edit_obj('apstats-u2-018',rewrite_u218)

          for qid in ['apstats-u3-013','apstats-u3-014']: add_variant(qid,'apstats-v-u3-one-proportion-z-stat')
          for qid in ['apstats-u4-008','apstats-u4-022']: add_variant(qid,'apstats-v-u4-one-mean-conditions')
          for qid in ['apstats-u4-009','apstats-u4-023']: add_variant(qid,'apstats-v-u4-one-mean-t-stat')
          for qid in ['apstats-u4-015','apstats-u4-024']: add_variant(qid,'apstats-v-u4-paired-ci-procedure')
          for qid in ['apstats-u2-021','apstats-u2-023']: add_variant(qid,'apstats-v-u2-clt-shape')
          for qid in ['apstats-u1-023','apstats-u1-036']: add_variant(qid,'apstats-v-u1-voluntary-response')

          def rewrite_u134(x):
              x=x.replace('A health researcher wants to describe weekly exercise time among adults in a county. Which investigative question is statistical and identifies the quantitative variable of interest?','An ecologist wants to describe germination time for seeds from a native plant population. Which investigative question is statistical and identifies the quantitative variable of interest?')
              x=x.replace('How is weekly exercise time distributed among adults in the county?','How is germination time distributed among seeds from the native plant population?')
              x=re.sub(r'"e": ".*?",','"e": "Germination time is a quantitative variable, and asking how it is distributed across a population anticipates variability among seeds and therefore requires a statistical investigation rather than a single factual lookup.",',x,count=1)
              return x
          edit_obj('apstats-u1-034',rewrite_u134)
          p.write_text(s)

          t=Path('tests/ap-statistics.test.js'); z=t.read_text()
          marker="test('Statistics shared stimulus sets, provenance, and visual accessibility are sound'"
          insert="""test('Statistics semantic near-duplicates are variant-grouped', () => {\n  const byId=new Map(bank.map(q=>[q.id,q]));\n  for(const ids of [\n    ['apstats-u3-013','apstats-u3-014'],\n    ['apstats-u4-008','apstats-u4-022'],\n    ['apstats-u4-009','apstats-u4-023'],\n    ['apstats-u4-015','apstats-u4-024'],\n    ['apstats-u2-021','apstats-u2-023'],\n    ['apstats-u1-023','apstats-u1-036'],\n  ]) { const a=byId.get(ids[0]),b=byId.get(ids[1]); assert.ok(a.variantGroupId); assert.equal(a.variantGroupId,b.variantGroupId); }\n  assert.match(byId.get('apstats-u2-018').q,/standard deviation/i);\n});\n\n"""
          assert marker in z and 'Statistics semantic near-duplicates are variant-grouped' not in z
          t.write_text(z.replace(marker,insert+marker,1))

          q=Path('tests/ap-statistics-quantitative-audit.test.js'); z=q.read_text()
          old="assert.equal(answer('apstats-u2-018'), String(0*0.50+2*0.30+5*0.20));"
          new="const mu18=0*0.50+2*0.30+5*0.20, var18=0.50*(0-mu18)**2+0.30*(2-mu18)**2+0.20*(5-mu18)**2; assert.ok(Math.abs(var18-3.64)<1e-12); assert.equal(answer('apstats-u2-018'),Math.sqrt(var18).toFixed(2));"
          assert old in z
          q.write_text(z.replace(old,new,1))
          PY
      - name: Validate fixes
        run: npm run check
      - name: Commit fixes
        run: |
          git config user.name Erross
          git config user.email 33665337+Erross@users.noreply.github.com
          git add data/ap-statistics.js tests/ap-statistics.test.js tests/ap-statistics-quantitative-audit.test.js
          git commit -m "Fix Statistics duplicate coverage audit findings"
          git push origin HEAD:subject/ap-statistics