name: Append EM U13B
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_append_em_u13b.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: python tools/_append_em_u13b.py
      - run: rm tools/_append_em_u13b.py .github/workflows/_append_em_u13b.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build AP Physics C E&M topics 13.4-13.6"
          git push origin HEAD:subject/ap-physics-c-em
