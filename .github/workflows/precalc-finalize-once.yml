name: Finalize AP Precalculus release candidate

on:
  push:
    branches:
      - release/ap-precalculus-2027-quality

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[run-precalc-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/ap-precalculus-2027-quality
      - name: Promote and record evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          subjects = Path('js/subjects.js')
          s = subjects.read_text()
          pattern = r'(id: "ap-precalculus"[\s\S]*?releaseStatus: )"draft"'
          s2, n = re.subn(pattern, r'\1"released"', s, count=1)
          if n != 1:
              raise SystemExit(f'expected one Precalculus releaseStatus replacement, got {n}')
          subjects.write_text(s2)

          test = Path('tests/ap-precalculus.test.js')
          t = test.read_text()
          old = 'assert.equal(subject.releaseStatus, "draft", "Precalculus must stay draft until an independent content review happens");'
          new = 'assert.equal(subject.releaseStatus, "released", "Precalculus release candidate must remain explicitly released");'
          if old not in t:
              raise SystemExit('Precalculus draft assertion not found')
          test.write_text(t.replace(old, new))

          evidence = Path('release-evidence/ap-precalculus-2027.md')
          evidence.parent.mkdir(exist_ok=True)
          evidence.write_text('''# AP Precalculus — May 2027 release evidence\n\n## Official format\n- Governing cycle: Fall 2026 course framework / May 2027 exam.\n- Section I: 42 multiple-choice questions in 105 minutes.\n- Part A: 29 questions in 65 minutes; calculator not permitted.\n- Part B: 13 questions in 40 minutes; graphing calculator required.\n- Units 1–3 are examinable; Unit 4 is 0% exam weight and is intentionally excluded from this MCQ bank.\n\n## Bank and CED coverage\n- 125 original, unofficial questions.\n- 44/44 examinable CED topics represented, with at least two items per topic.\n- Exact Fall 2026 skill labels audited across all questions.\n- Practice-family mix after clean-room repair: within published CED bands for Practices 1, 2, and 3.\n- 14 semantic variant groups prevent same-exam near-duplicate delivery.\n\n## Clean-room findings and repairs\nThe independent restart audit found and repaired a severely skewed Practice 2 inventory, several exact-skill mismatches, a contradictory linear-model stem, a randomized-delivery dependency, a polar-coordinate equivalence error, an incomplete logarithmic-limit answer, weak distractors, and answer-length cues. Regression tests now lock those repairs.\n\n## Final automated release gate\nExact audited head: `c20166242b2e4decf3a2093edd4aa23768fe3568`.\n\n- Effective bank: 125 questions across 2 browser data layers.\n- Draw size: 42.\n- Stimulus groups: 0.\n- Variant groups: 14.\n- Uniquely-longest correct answer: 2.4%.\n- Among-longest correct answer: 57.6% (project ceiling 58%).\n- Average option length: correct 5.61 words vs distractors 5.89.\n- Raw keys: A 25.6%, B 24.8%, C 24.8%, D 24.8%.\n- Randomized draw simulation: 5,000 / 5,000 valid.\n- Independent-attempt overlap: 36.7% across 5,000 pairs (project target <=40%).\n- Full repository gate: 145 / 145 tests passed.\n- Dependency audit: 0 vulnerabilities.\n\n## Student-facing / naive-assessor simulation\nThe release uses the shared catalog and preflight flow whose regression suite verifies that the timer cannot start before confirmation and that timing, part structure, calculator policy, local-save behavior, navigation, and the site's MCQ-only scope are exposed to the student. This is a product-level naive-assessor simulation, not a claim of an external human usability study.\n\n## Promotion decision\nAll automated, subject-specific clean-room, quantitative spot-check, answer-construction, randomized-draw, retake-overlap, and student-facing interface gates passed. AP Precalculus is approved for release pending promoted-artifact, integration, Pages deployment, and public smoke checks.\n''')

          readme = Path('README.md')
          r = readme.read_text()
          r = r.replace('eight released', 'nine released').replace('8 released', '9 released')
          if 'AP Precalculus' not in r:
              r += '\n\n### AP Precalculus\nReleased for the May 2027 format after clean-room CED, content, draw, overlap, and naive-interface audits.\n'
          readme.write_text(r)
          PY
      - name: Remove one-off Precalculus build tooling
        run: |
          rm -f .github/workflows/precalc-import-once.yml \
                .github/workflows/precalc-release-audit.yml \
                .github/workflows/precalc-export-audit.yml \
                .github/workflows/precalc-harden-run.yml \
                .github/workflows/precalc-test-fix-once.yml \
                .github/workflows/precalc-finalize-once.yml \
                tools/precalc-import-current-main.js \
                tools/precalc-harden-skills.js \
                tools/precalc-content-fixes.js
      - name: Commit final release candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize AP Precalculus release candidate"
          git push origin HEAD:release/ap-precalculus-2027-quality
