name: Promote EM Release
on:
  push:
    branches: [integration/ap-physics-c-em-release]
    paths:
      - 'tools/_promote_em_release.py'
      - '.github/workflows/_promote_em_release.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/ap-physics-c-em-release
      - run: python tools/_promote_em_release.py
      - run: rm tools/_promote_em_release.py .github/workflows/_promote_em_release.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js tests/ap-physics-c-em.test.js tools/_promote_em_release.py .github/workflows/_promote_em_release.yml
          git commit -m "Promote AP Physics C E&M to released"
          git push origin HEAD:integration/ap-physics-c-em-release
