name: One-shot AP World release-shape repair
on:
  push:
    branches: [subject/ap-world-history]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[world-shape-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-world-history
          fetch-depth: 0
      - run: git fetch origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_world-release-shape-once.js
      - run: |
          rm tools/_world-release-shape-once.js .github/workflows/_world-release-shape-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize AP World draft release shape [world-shape-done]"
          git push origin HEAD:subject/ap-world-history
