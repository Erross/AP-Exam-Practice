name: AP Comparative Government full audit
on:
  push:
    branches: [subject/ap-comparative-government]
jobs:
  audit:
    if: github.event.head_commit.message == 'Trigger AP Comparative Government full audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-comparative-government
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run release:audit -- --subject ap-comparative-government --trials 5000 --overlap-trials 5000
      - run: npm run check
