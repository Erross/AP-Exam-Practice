name: AP Physics 2 Naive Audit 1
on:
  push:
    branches: [audit/ap-physics-2-iterative]
    paths: [.github/workflows/apphys2-naive-audit1.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - name: Full repository gate
        run: npm run check
      - name: Independent browser-effective Physics 2 audit
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm'), crypto=require('crypto');
          const {AP_SUBJECTS}=require('./js/subjects');
          const {drawExam}=require('./js/draw');
          const {loadPhysics2Bank}=require('./tests/helpers');
          function finalBank(){const s={window:{}};vm.createContext(s);for(const f of ['data/ap-physics-2.js','data/ap-physics-2-quality-fixes.js'])vm.runInContext(fs.readFileSync(f,'utf8'),s);return s.window.QUESTIONS_AP_PHYSICS_2;}
          const bank=finalBank(), helper=loadPhysics2Bank(), subject=AP_SUBJECTS.find(x=>x.id==='ap-physics-2');
          const stable=x=>JSON.stringify(x); const hash=x=>crypto.createHash('sha256').update(stable(x)).digest('hex');
          const issues=[];
          console.log('BANK',bank.length,'FINAL_HASH',hash(bank),'HELPER_HASH',hash(helper),'IDENTICAL',hash(bank)===hash(helper));
          if(hash(bank)!==hash(helper)) issues.push('tests/helpers.js does not load the browser-effective quality-fix layer');
          if(bank.length!==140) issues.push(`bank length ${bank.length}`);
          const ids=new Set(); const skills={}; const topics={}; const groups={};
          const wc=s=>String(s).trim().split(/\s+/).filter(Boolean).length; let ul=0,al=0,cw=0,dw=0; const pos=[0,0,0,0];
          const ABS=/\b(always|never|every|only|entirely|unlimited|none|all|impossible|guarantee[sd]?|completely|identical)\b/i;
          for(const q of bank){
            if(ids.has(q.id)) issues.push(`duplicate id ${q.id}`); ids.add(q.id);
            if(q.o?.length!==4||q.c?.length!==1||q.c[0]<0||q.c[0]>3) issues.push(`${q.id} malformed options/key`);
            if((q.e||'').length<90) issues.push(`${q.id} short explanation`);
            skills[q.skill]=(skills[q.skill]||0)+1; topics[q.topicCode]=(topics[q.topicCode]||0)+1; pos[q.c[0]]++;
            const ls=q.o.map(wc), m=Math.max(...ls), cl=ls[q.c[0]]; if(cl===m)al++; if(cl===m&&ls.filter(x=>x===m).length===1)ul++; cw+=cl; ls.forEach((x,i)=>{if(i!==q.c[0])dw+=x});
            const hits=q.o.filter((_,i)=>i!==q.c[0]).filter(x=>ABS.test(x)); if(hits.length>=2)issues.push(`${q.id} stacked absolutes ${JSON.stringify(hits)}`);
            if(q.variantGroupId){(groups[q.variantGroupId]??=[]).push(q)}
          }
          console.log('SKILL_COUNTS',skills); console.log('KEY_POS',pos);
          console.log('BIAS uniqueLongest',`${ul}/${bank.length}`, (ul/bank.length).toFixed(4),'amongLongest',(al/bank.length).toFixed(4),'avg', (cw/bank.length).toFixed(2),(dw/(bank.length*3)).toFixed(2));
          for(const [g,qs] of Object.entries(groups)){if(qs.length<2)issues.push(`${g} singleton`);if(new Set(qs.map(q=>q.topicCode)).size>1)issues.push(`${g} crosses topics`)}
          // Different-token near-duplicate scan.
          const toks=s=>new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>3));
          const sim=(a,b)=>{const A=toks(a),B=toks(b), inter=[...A].filter(x=>B.has(x)).length;return inter/Math.max(1,new Set([...A,...B]).size)};
          const near=[]; for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++){if(bank[i].topicCode!==bank[j].topicCode)continue;const s=sim(bank[i].q,bank[j].q);if(s>=0.55)near.push([s.toFixed(3),bank[i].id,bank[j].id,bank[i].variantGroupId||'',bank[j].variantGroupId||'']);}
          near.sort((a,b)=>b[0]-a[0]); console.log('NEAR_DUP_CANDIDATES',near.slice(0,30));
          // Exact-skill semantic inventory. These are review candidates, not automatic failures.
          const cues={
            '2.A':/derive|symbolic|expression|equation|in terms of|relationship/i,
            '2.B':/calculate|estimate|what is|magnitude|value|how much|distance|speed|energy|current|voltage|temperature|wavelength|frequency|power|resistance/i,
            '2.C':/compare|ratio|relative|greater|less|larger|smaller|same|twice|half|between/i,
            '2.D':/predict|factor|doubl|trip|chang|increase|decrease|depend|proportional|how does/i,
            '3.C':/justify|support|evidence|why|reason|best explains|consistent with|data|table|principle|law/i,
          };
          for(const sk of Object.keys(cues)){
            const arr=bank.filter(q=>q.skill===sk&&!cues[sk].test(`${q.q} ${q.o[q.c[0]]}`));
            console.log('SEMANTIC_CANDIDATES',sk,arr.map(q=>q.id));
          }
          // Print all items compactly for human semantic review.
          for(const sk of ['2.A','2.B','2.C','2.D','3.B','3.C']){
            console.log(`\n=== ${sk} ===`);
            bank.filter(q=>q.skill===sk).forEach(q=>console.log(q.id,'|',q.topicCode,'| Q:',q.q,'| KEY:',q.o[q.c[0]],'| E:',q.e));
          }
          // Stress draw constraints and overlap against the browser-effective bank.
          for(let n=0;n<10000;n++){
            const d=drawExam(subject,bank); if(d.length!==42)throw new Error(`draw length ${d.length}`);
            const uc=Object.fromEntries(subject.units.map(u=>[u.id,d.filter(q=>q.unit===u.id).length]));
            const exp={U9:7,U10:7,U11:7,U12:5,U13:5,U14:6,U15:5}; for(const [u,v] of Object.entries(exp))if(uc[u]!==v)throw new Error(`${u} draw ${uc[u]}`);
            for(const [sk,r] of Object.entries(subject.attributeRanges.skill)){const c=d.filter(q=>q.skill===sk).length;if(c<r[0]||c>r[1])throw new Error(`skill ${sk} ${c}`)}
            const sgs=new Set(d.filter(q=>q.stimulusGroupId).map(q=>q.stimulusGroupId)); if(sgs.size<2||sgs.size>4)throw new Error(`sets ${sgs.size}`);
          }
          let ov=0; for(let n=0;n<10000;n++){const a=new Set(drawExam(subject,bank).map(q=>q.id));ov+=drawExam(subject,bank).filter(q=>a.has(q.id)).length/42;} console.log('RETAKE_OVERLAP',ov/10000);
          console.log('ISSUES',issues);
          if(issues.length)process.exitCode=1;
          NODE