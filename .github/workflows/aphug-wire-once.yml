name: Wire AP Human Geography
on:
  push:
    branches: [subject/ap-human-geography]
permissions:
  contents: write
jobs:
  wire:
    if: contains(github.event.head_commit.message, '[wire-aphug]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-human-geography
      - name: Apply repairs
        run: python tools/aphug-fix-core.py
      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Constrain Human Geography blueprint and fix layer diagnostics"
          git push origin HEAD:subject/ap-human-geography
