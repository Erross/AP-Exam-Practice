name: Promote AP Physics C Mechanics
on:
  push:
    branches: [integration/ap-physics-c-mechanics-release]
    paths:
      - 'tools/_promote_pcm.py'
      - '.github/workflows/_promote_pcm.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/ap-physics-c-mechanics-release
      - run: python tools/_promote_pcm.py
      - run: rm tools/_promote_pcm.py .github/workflows/_promote_pcm.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js tests/ap-physics-c-mechanics.test.js tools/_promote_pcm.py .github/workflows/_promote_pcm.yml
          git commit -m "Promote AP Physics C Mechanics to released"
          git push
