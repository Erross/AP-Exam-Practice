name: AP Statistics Naive Fix Cycle 3
on:
  push:
    branches: [subject/ap-statistics]
    paths: [.github/workflows/apstats-naive-fix-cycle3.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-statistics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Fix exact learning-objective semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/ap-statistics.js'); s=p.read_text()
          def edit(qid,qtext,opts,correct,expl):
              global s
              pat=r'(\{\n    "id": "'+re.escape(qid)+r'"[\s\S]*?\n  \})'; m=re.search(pat,s); assert m,qid
              x=m.group(1)
              repl='"q": '+repr(qtext).replace("'",'"')+',\n    "o": [\n'+''.join('      '+repr(o).replace("'",'"')+(',' if i<3 else '')+'\n' for i,o in enumerate(opts))+'    ],\n    "c": [\n      '+str(correct)+'\n    ],\n    "e": '+repr(expl).replace("'",'"')+','
              x2=re.sub(r'"q": ".*?",\n    "o": \[[\s\S]*?\n    \],\n    "c": \[[\s\S]*?\n    \],\n    "e": ".*?",',repl,x,count=1); assert x2!=x,qid
              s=s[:m.start(1)]+x2+s[m.end(1):]
          edit('apstats-u1-022',
            'A district wants student opinions represented from elementary, middle, and high schools even though the three groups differ greatly in size. Which sampling design is most appropriate, and why?',
            ['Take a random sample separately within each school level because stratification ensures that every level is represented.',
             'Randomly choose one school level and survey everyone in it because one cluster can represent all three levels.',
             'Take a simple random sample from the full district because it guarantees equal numbers from every school level.',
             'Survey the same number of volunteers from each level because voluntary participation removes selection bias.'],0,
            'A stratified random sample divides the population into the relevant school-level strata and samples randomly within each one. That design guarantees representation from elementary, middle, and high school students while retaining random selection within each group.')
          edit('apstats-u3-001',
            'A random sample of 120 voters contains 72 who support a proposal. What point estimate should be used for the population proportion p who support the proposal?',
            ['0.60','0.40','72','1.67'],0,
            'The sample proportion is the point estimator for a population proportion. Here p̂ = 72/120 = 0.60, so 0.60 is the estimate of the unknown population proportion p.')
          edit('apstats-u3-002',
            'A statistic T has a sampling distribution centered 4 units above the population parameter it estimates. Which conclusion about the estimator is justified?',
            ['T is biased upward by 4 units because its sampling-distribution center exceeds the parameter by 4.',
             'T is unbiased because its sampling distribution has a well-defined center.',
             'T is biased downward by 4 units because the parameter lies below the sampling-distribution center.',
             'T must have a standard error of 4 units because its center differs from the parameter by 4.'],0,
            'An estimator is unbiased when the center of its sampling distribution equals the parameter. Because the center for T is 4 units above the parameter, T systematically overestimates by 4 units and is biased upward by 4.')
          p.write_text(s)

          q=Path('tests/ap-statistics-quantitative-audit.test.js'); z=q.read_text()
          old="assert.equal(answer('apstats-u3-001'),'2/3'); assert.equal(0.030/0.045,2/3);"
          new="assert.equal(answer('apstats-u3-001'),'0.60'); assert.equal(72/120,0.60);"
          assert old in z; q.write_text(z.replace(old,new,1))

          t=Path('tests/ap-statistics.test.js'); z=t.read_text(); marker="test('Statistics construction skills require constructing or selecting a concrete representation'"
          insert="""test('Statistics exact justify and estimator objectives are semantic, not family-only matches', () => {\n  const q=id=>bank.find(x=>x.id===id);\n  assert.match(q('apstats-u1-022').q,/and why/i);\n  assert.match(q('apstats-u1-022').o[q('apstats-u1-022').c[0]],/because stratification/i);\n  assert.match(q('apstats-u3-001').q,/point estimate/i);\n  assert.match(q('apstats-u3-002').o[q('apstats-u3-002').c[0]],/because its sampling-distribution center/i);\n});\n\n"""
          assert marker in z and 'Statistics exact justify and estimator objectives' not in z
          t.write_text(z.replace(marker,insert+marker,1))
          PY
      - name: Validate cycle 3 fixes
        run: npm run check
      - name: Commit cycle 3 fixes
        run: |
          git config user.name Erross
          git config user.email 33665337+Erross@users.noreply.github.com
          git add data/ap-statistics.js tests/ap-statistics.test.js tests/ap-statistics-quantitative-audit.test.js
          git commit -m "Fix Statistics exact learning objective semantics"
          git push origin HEAD:subject/ap-statistics