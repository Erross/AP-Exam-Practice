name: Test

on:
  pull_request:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Materialize AP AAS canonical metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/subject/ap-african-american-studies'
        run: |
          node tools/materialize-ap-african-american-studies-metadata.js
          if ! git diff --quiet -- js/subjects.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/subjects.js
            git commit -m "Consolidate AP AAS metadata into subject registry"
            git push origin HEAD:subject/ap-african-american-studies
          fi
