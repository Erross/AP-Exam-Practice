name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consolidate English public-domain layers
        if: github.event_name == 'push' && github.ref == 'refs/heads/subject/ap-english-public-domain-passages'
        run: node tools/consolidate-english-public-domain.js
      - run: npm run check
      - name: Commit green canonical consolidation
        if: github.event_name == 'push' && github.ref == 'refs/heads/subject/ap-english-public-domain-passages'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate AP English public-domain banks"
          git push
