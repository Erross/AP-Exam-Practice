name: AP Art History final release gate
on:
  push:
    branches: [subject/ap-art-history]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run release:audit -- --subject ap-art-history --trials 5000 --overlap-trials 5000 | tee /tmp/aparth-audit.txt
      - run: npm run check
      - run: |
          mkdir -p release-evidence
          cp /tmp/aparth-audit.txt release-evidence/ap-art-history-final-audit.txt
          cat > release-evidence/ap-art-history.md <<'EOF'
          # AP Art History release evidence

          Release candidate validated 2026-08-14 against the repository subject-release process.

          - Current-format registry: 80 MCQs, 60 minutes, 50% of the AP score; calculator not permitted.
          - Ten College Board content areas represented by the configured unit blueprint.
          - MCQ Skill 1–7 delivery is exact at 15/24/10/16/5/5/5; Skill 8 argumentation is intentionally absent from MCQ.
          - 340 original questions in one canonical shipping bank.
          - 48 two-question visual stimulus sets; 38 prescribed-work sets plus 10 unfamiliar-work sets.
          - Every visual is a local asset with reusable-image provenance in assets/ap-art-history/SOURCES.json.
          - Unknown-work accessibility metadata is non-identifying and does not leak attribution answers.
          - Visual sources remain inspectable during the exam and answer review, with a larger-image link.
          - Clean-room semantic review was restarted after repairs; permanent quality regressions cover formal analysis, contextual analysis, comparison, tradition, attribution, interpretation, and unknown-work leakage.
          - Naive-student UX review prompted explicit image-based preflight guidance and larger-image/review affordances.
          - Final quantitative audit output is preserved in ap-art-history-final-audit.txt.
          - Full repository npm run check passed on the final candidate before promotion.
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-evidence/ap-art-history.md release-evidence/ap-art-history-final-audit.txt
          git commit -m "Record AP Art History final release evidence"
          git push origin HEAD:subject/ap-art-history
