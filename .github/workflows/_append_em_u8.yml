name: Append AP Physics C E&M Unit 8
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_append_em_u8.yml]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: python tools/_append_em_u8.py
      - run: rm tools/_append_em_u8.py .github/workflows/_append_em_u8.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-physics-c-em.js tools/_append_em_u8.py .github/workflows/_append_em_u8.yml
          git commit -m "Complete AP Physics C E&M Unit 8 bank"
          git push origin HEAD:subject/ap-physics-c-em
