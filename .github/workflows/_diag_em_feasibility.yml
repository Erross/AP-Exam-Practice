name: Diagnose EM Feasibility
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_diag_em_feasibility.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tools/_diag_em_feasibility.js
