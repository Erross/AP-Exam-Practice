name: Human Geography release toggle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-human-geography
      - run: |
          sed -i '/id: "ap-human-geography"/,/dataVar: "QUESTIONS_AP_HUMAN_GEOGRAPHY"/ s/releaseStatus: "draft"/releaseStatus: "released"/' js/subjects.js
          sed -i 's/assert.equal(subject.releaseStatus,"draft")/assert.equal(subject.releaseStatus,"released")/' tests/ap-human-geography-bank.test.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js tests/ap-human-geography-bank.test.js
          git commit -m "Promote AP Human Geography to released"
          git push origin HEAD:subject/ap-human-geography
