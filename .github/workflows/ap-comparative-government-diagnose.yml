name: Diagnose AP Comparative Government template bias
on:
  push:
    branches: [subject/ap-comparative-government]
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Trigger Comparative Government template diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-comparative-government
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/diagnose-ap-comparative-government.js
