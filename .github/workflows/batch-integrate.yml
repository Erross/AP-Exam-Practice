name: Batch Integrate Active Branches

on:
  push:
    branches: [integration/2026-08-batch-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-integrate-active
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/2026-08-batch-release
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch reviewed source branches
        run: |
          git fetch origin integration/2026-08-ap-physics-2 subject/ap-calculus-ab
      - name: Integrate Physics 2
        run: |
          node tools/batch-integrate-active-branches.js
          git add data/ap-physics-2.js tests/ap-physics-2.test.js tests/helpers.js js/subjects.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Batch integrate reviewed AP Physics 2"
      - name: Diagnose Calculus AB merge conflicts
        run: |
          set +e
          git merge --no-commit --no-ff origin/subject/ap-calculus-ab
          status=$?
          echo "merge_status=$status"
          echo "Unmerged files:"
          git diff --name-only --diff-filter=U || true
          exit 1
