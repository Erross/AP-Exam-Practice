name: Batch Integrate Active Branches

on:
  push:
    branches: [integration/2026-08-batch-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: batch-integrate-active
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/2026-08-batch-release
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Merge reviewed Calculus AB branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin subject/ap-calculus-ab
          git show origin/subject/ap-calculus-ab:tools/resolve-calculus-batch-merge.js > /tmp/resolve-calculus.js
          set +e
          git merge --no-commit --no-ff origin/subject/ap-calculus-ab
          merge_status=$?
          set -e
          conflicts=$(git diff --name-only --diff-filter=U || true)
          unexpected=$(printf '%s\n' "$conflicts" | grep -vE '^(README\.md|js/draw\.js|style\.css)?$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected conflicts:"
            echo "$unexpected"
            exit 1
          fi
          if echo "$conflicts" | grep -q '^README.md$'; then git checkout --ours README.md; fi
          if echo "$conflicts" | grep -q '^js/draw.js$'; then git checkout --ours js/draw.js; fi
          if echo "$conflicts" | grep -q '^style.css$'; then git checkout --ours style.css; fi
          git checkout HEAD -- package-lock.json
          node /tmp/resolve-calculus.js
          rm -f tools/calculus-batch-conflicts.txt tools/resolve-calculus-batch-merge.js
          rm -f .github/workflows/resolve-calculus-batch.yml .github/workflows/diagnose-calculus-batch.yml
          rm -f tools/batch-integrate-active-branches.js
          git add -A
      - run: npm ci
      - run: npm run check
      - name: Commit green batch integration
        run: |
          rm -f .github/workflows/batch-integrate.yml
          git add -A
          git commit -m "Integrate reviewed AP Calculus AB into August batch"
          git push origin HEAD:integration/2026-08-batch-release
