name: AP Statistics Naive Audit Cycle
on:
  push:
    branches: [subject/ap-statistics]
    paths: [.github/workflows/apstats-naive-audit-cycle.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Deep same-topic duplicate audit
        run: |
          node - <<'NODE'
          const {loadStatisticsBank}=require('./tests/helpers'); const bank=loadStatisticsBank();
          const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|a|an|of|to|and|for|is|are|in|that|with|which|what|does|when|from|be|by|on|it|this|as|at|or|has|have)\b/g,' ').replace(/\s+/g,' ').trim();
          const toks=s=>new Set(norm(s).split(' ').filter(x=>x.length>2)); const jac=(a,b)=>{a=toks(a);b=toks(b);let i=0;for(const x of a)if(b.has(x))i++;return i/(a.size+b.size-i||1)};
          const pairs=[]; for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++)if(bank[i].unit===bank[j].unit&&bank[i].topicCode===bank[j].topicCode&&!bank[i].stimulusGroupId&&!bank[j].stimulusGroupId){const s=jac(bank[i].q,bank[j].q); if(s>=.18)pairs.push([s,bank[i],bank[j]]);}
          pairs.sort((a,b)=>b[0]-a[0]); for(const [s,a,b] of pairs){console.log(`PAIR ${s.toFixed(3)} ${a.id} ${b.id} VG=${a.variantGroupId||'-'}/${b.variantGroupId||'-'}\n A ${a.q} => ${a.o[a.c[0]]}\n B ${b.q} => ${b.o[b.c[0]]}`)}
          const groups={}; for(const q of bank)if(q.variantGroupId)(groups[q.variantGroupId]??=[]).push(q.id); console.log('VARIANT_GROUPS',JSON.stringify(groups));
          for(const q of bank){const n=q.o.map(norm); if(new Set(n).size!==4) console.log('NORM_COLLISION',q.id,JSON.stringify(q.o));}
          NODE