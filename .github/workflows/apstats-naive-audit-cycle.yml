name: AP Statistics Naive Audit Cycle
on:
  push:
    branches: [subject/ap-statistics]
    paths: [.github/workflows/apstats-naive-audit-cycle.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Full repository validation
        run: npm run check
      - name: Independent clean-room bank audit
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {loadStatisticsBank}=require('./tests/helpers'); const {AP_SUBJECTS}=require('./js/subjects'); const {drawExam}=require('./js/draw');
          const bank=loadStatisticsBank(), subject=AP_SUBJECTS.find(s=>s.id==='ap-statistics');
          assert.equal(bank.length,140); assert.equal(new Set(bank.map(q=>q.id)).size,140);
          const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|a|an|of|to|and|for|is|are|in|that|with|which|what|does|when|from|be|by|on|it|this|as|at|or|has|have)\b/g,' ').replace(/\s+/g,' ').trim();
          const toks=s=>new Set(norm(s).split(' ').filter(x=>x.length>2)); const jac=(a,b)=>{a=toks(a);b=toks(b);let i=0;for(const x of a)if(b.has(x))i++;return i/(a.size+b.size-i||1)};
          for(const q of bank){assert.equal(q.o.length,4,q.id);assert.equal(new Set(q.o).size,4,q.id);assert.equal(q.c.length,1,q.id);assert.ok(q.e.length>=90,q.id);}
          const duplicateE=[];for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++)if(norm(bank[i].e)===norm(bank[j].e))duplicateE.push([bank[i].id,bank[j].id]);assert.deepEqual(duplicateE,[]);
          const bySkill={};for(const q of bank)(bySkill[q.skill]??=[]).push(q);
          for(const sk of Object.keys(bySkill).sort()) {console.log('SKILL',sk);for(const q of bySkill[sk])console.log(`${q.id} ${q.topicCode} ${q.q} => ${q.o[q.c[0]]}`)}
          // Task-semantic smoke checks independent from topic whitelist.
          for(const q of bySkill['1.A']||[]) assert.match(q.q,/question|investigative/i,q.id);
          for(const q of bySkill['3.A']||[]) assert.match(q.q,/table|chart|plot|graph|distribution|representation|constructed/i,q.id);
          for(const q of bySkill['4.E']||[]) assert.match(q.q,/condition|appropriate|supports|questionable|verify|verifies|pooled|random|skew|outlier/i,q.id);
          for(const q of bySkill['4.G']||[]) assert.match(q.q,/claim|conclusion|decision|evidence|suggest|result/i,q.id);
          const pairs=[];for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++)if(bank[i].unit===bank[j].unit&&bank[i].topicCode===bank[j].topicCode&&!bank[i].stimulusGroupId&&!bank[j].stimulusGroupId){const score=jac(bank[i].q,bank[j].q);if(score>=.32)pairs.push([score,bank[i],bank[j]]);}
          pairs.sort((a,b)=>b[0]-a[0]);for(const [score,a,b] of pairs){const tagged=a.variantGroupId&&a.variantGroupId===b.variantGroupId;console.log('PAIR',score.toFixed(3),a.id,b.id,tagged?'TAGGED':'UNTAGGED');if(score>=.55)assert.ok(tagged,`high-similarity untagged pair ${a.id}/${b.id}`);}
          // Every variant group must be meaningful and same-topic.
          const vg={};for(const q of bank)if(q.variantGroupId)(vg[q.variantGroupId]??=[]).push(q);for(const [g,qs] of Object.entries(vg)){assert.ok(qs.length>=2,g);assert.equal(new Set(qs.map(q=>q.unit)).size,1,g);assert.equal(new Set(qs.map(q=>q.topicCode)).size,1,g);assert.ok(qs.every(q=>!q.stimulusGroupId),g);}
          let overlap=0,N=10000;for(let i=0;i<N;i++){const a=new Set(drawExam(subject,bank).map(q=>q.id));overlap+=drawExam(subject,bank).filter(q=>a.has(q.id)).length/42;} overlap/=N;console.log('OVERLAP_10000',overlap);assert.ok(overlap<=.40);
          for(let i=0;i<20000;i++){const d=drawExam(subject,bank);assert.equal(d.length,42);const sg={};for(const q of d)if(q.stimulusGroupId)(sg[q.stimulusGroupId]??=[]).push(q);for(const [g,qs] of Object.entries(sg))assert.equal(qs.length,3,g);const seen=new Set();for(const q of d)if(q.variantGroupId){assert.ok(!seen.has(q.variantGroupId),`variant collision ${q.variantGroupId}`);seen.add(q.variantGroupId)}}
          console.log('DRAWS_20000 PASS');
          console.log('FINAL_CLEANROOM_PASS');
          NODE