name: AP Calculus BC draft release audit
on:
  push:
    branches: [subject/ap-calculus-bc]
jobs:
  audit:
    if: github.event.head_commit.message == 'Run AP Calculus BC draft release audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-calculus-bc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/ap-calculus-bc.test.js
      - run: npm run release:audit -- --subject ap-calculus-bc --trials 5000 --overlap-trials 5000
      - run: npm run check
