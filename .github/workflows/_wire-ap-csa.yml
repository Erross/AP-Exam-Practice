name: Wire AP CSA browser bank
on:
  push:
    paths: ['.github/workflows/_wire-ap-csa.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-computer-science-a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tools/_wire-ap-csa.js
      - run: rm tools/_wire-ap-csa.js .github/workflows/_wire-ap-csa.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tools/_wire-ap-csa.js .github/workflows/_wire-ap-csa.yml
          git commit -m "Wire AP CSA effective browser bank"
          git push origin HEAD:subject/ap-computer-science-a
