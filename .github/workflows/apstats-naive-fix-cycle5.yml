name: AP Statistics Naive Fix Cycle 5
on:
  push:
    branches: [subject/ap-statistics]
    paths: [.github/workflows/apstats-naive-fix-cycle5.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-statistics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Group discrete-random-variable parameter alternate forms
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/ap-statistics.js'); s=p.read_text()
          for qid in ['apstats-u2-015','apstats-u2-018']:
              pat=r'(\{\n    "id": "'+re.escape(qid)+r'"[\s\S]*?\n  \})'; m=re.search(pat,s); assert m,qid
              x=m.group(1); assert '"variantGroupId"' not in x and '"stimulusGroupId"' not in x
              a='"statsSetType": "standalone"'; assert a in x
              x=x.replace(a,a+',\n    "variantGroupId": "apstats-v-u2-rv-parameters"',1)
              s=s[:m.start(1)]+x+s[m.end(1):]
          p.write_text(s)
          t=Path('tests/ap-statistics.test.js'); z=t.read_text()
          anchor="    ['apstats-u2-021','apstats-u2-023'],"
          assert anchor in z
          z=z.replace(anchor,"    ['apstats-u2-015','apstats-u2-018'],\n"+anchor,1)
          t.write_text(z)
          PY
      - name: Validate cycle 5 fix
        run: npm run check
      - name: Commit cycle 5 fix
        run: |
          git config user.name Erross
          git config user.email 33665337+Erross@users.noreply.github.com
          git add data/ap-statistics.js tests/ap-statistics.test.js
          git commit -m "Group Statistics random-variable parameter variants"
          git push origin HEAD:subject/ap-statistics