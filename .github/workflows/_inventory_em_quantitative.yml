name: Inventory EM Quantitative
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_inventory_em_quantitative.yml]
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: node tools/_inventory_em_quantitative.js
      - run: rm tools/_inventory_em_quantitative.js .github/workflows/_inventory_em_quantitative.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove E&M quantitative inventory helper"
          git push origin HEAD:subject/ap-physics-c-em
