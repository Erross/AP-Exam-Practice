name: One-time APES registry wiring
on:
  push:
    branches: [subject/ap-environmental-science]
    paths:
      - 'tools/_wire-apes-registry.js'
      - '.github/workflows/_wire-apes-registry.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-environmental-science
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_wire-apes-registry.js
      - name: Commit targeted registry edit and remove temporary tooling
        run: |
          rm tools/_wire-apes-registry.js .github/workflows/_wire-apes-registry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js tools/_wire-apes-registry.js .github/workflows/_wire-apes-registry.yml
          git commit -m "Wire verified AP Environmental Science draft metadata safely"
          git push origin HEAD:subject/ap-environmental-science
