name: Audit AP Psychology
on: [push]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-psychology
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect Psychology bank
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'); const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('data/ap-psychology.js','utf8'),s);
          const b=s.window.QUESTIONS_AP_PSYCHOLOGY; const fam=q=>String(q.skill).split('.')[0];
          console.log('Psych bank size',b.length);
          console.log('Psych topics',new Set(b.map(q=>q.topicCode)).size);
          console.log('Psych units',Object.fromEntries([...new Set(b.map(q=>q.unit))].map(u=>[u,b.filter(q=>q.unit===u).length])));
          console.log('Psych skills',Object.fromEntries(['1','2','3','4'].map(k=>[k,b.filter(q=>fam(q)===k).length])));
          console.log('Psych research sets',new Set(b.filter(q=>q.stimulusGroupId).map(q=>q.stimulusGroupId)).size);
          NODE
          node tools/subject-release-audit.js --subject ap-psychology --trials 1000 --overlap-trials 1000
