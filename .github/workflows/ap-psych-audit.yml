name: Audit AP Psychology
on: [push]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-psychology
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Psychology release regressions
        run: node --test tests/ap-psychology.test.js
      - name: Run 5k Psychology release audit
        run: node tools/subject-release-audit.js --subject ap-psychology --trials 5000 --overlap-trials 5000
      - name: Run full repository gate
        run: npm run check
