name: Repair AP Statistics
on:
  push:
    branches: [subject/ap-statistics]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch reconstruction script
        run: |
          node .apstats-hotfix.js
          node .apstats-balance.js
      - name: Reconstruct and wire AP Statistics
        run: node .apstats-repair.js
      - name: Validate repaired course
        run: |
          npm ci
          npm run check
      - name: Commit repair
        run: |
          rm -rf .apstats-build .apstats-parts .apstats-repair.js .apstats-hotfix.js .apstats-balance.js .github/workflows/apstats-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete AP Statistics course implementation"
          git push
