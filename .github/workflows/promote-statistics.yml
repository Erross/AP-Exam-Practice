name: Promote AP Statistics release candidate

on:
  push:
    branches: [release/ap-statistics-2027]

permissions:
  contents: write

jobs:
  promote-and-audit:
    if: ${{ !contains(github.event.head_commit.message, '[release-audit-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/ap-statistics-2027
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Promote Statistics metadata and release regression
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const subjectsPath = 'js/subjects.js';
          let subjects = fs.readFileSync(subjectsPath, 'utf8');
          const start = subjects.indexOf('id: "ap-statistics"');
          const end = subjects.indexOf('dataVar: "QUESTIONS_AP_STATISTICS"', start);
          if (start < 0 || end < 0) throw new Error('AP Statistics registry block not found');
          const block = subjects.slice(start, end);
          if (!block.includes('releaseStatus: "draft"')) throw new Error('Statistics is not in expected draft state');
          subjects = subjects.slice(0, start) + block.replace('releaseStatus: "draft"', 'releaseStatus: "released"') + subjects.slice(end);
          fs.writeFileSync(subjectsPath, subjects);

          const testPath = 'tests/ap-statistics.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace("assert.equal(bank.length, 140); assert.equal(subject.releaseStatus, 'draft');", "assert.equal(bank.length, 140); assert.equal(subject.releaseStatus, 'released');");
          fs.writeFileSync(testPath, test);
          NODE
      - name: Run generic subject release audit
        run: |
          mkdir -p release-evidence
          npm run release:audit -- --subject ap-statistics --trials 5000 --overlap-trials 5000 | tee release-evidence/ap-statistics-2027-audit.txt
      - name: Run full repository release gate
        run: npm run check
      - name: Commit audited release candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/subjects.js tests/ap-statistics.test.js release-evidence/ap-statistics-2027-audit.txt
          git commit -m "Promote AP Statistics after release audit [release-audit-complete]"
          git push origin HEAD:release/ap-statistics-2027
