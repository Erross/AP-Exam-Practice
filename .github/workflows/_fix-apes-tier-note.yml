name: One-time APES preflight note fix
on:
  push:
    branches: [subject/ap-environmental-science]
    paths:
      - 'tools/_fix-apes-tier-note.js'
      - '.github/workflows/_fix-apes-tier-note.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-environmental-science
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_fix-apes-tier-note.js
      - name: Commit targeted note fix and remove temporary tooling
        run: |
          rm tools/_fix-apes-tier-note.js .github/workflows/_fix-apes-tier-note.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js tools/_fix-apes-tier-note.js .github/workflows/_fix-apes-tier-note.yml
          git commit -m "Clarify AP Environmental Science calculator preflight"
          git push origin HEAD:subject/ap-environmental-science
