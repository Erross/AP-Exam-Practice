name: One-shot APUSH promotion
on:
  push:
    branches: [subject/ap-us-history]
permissions:
  contents: write
jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[apush-promoted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-us-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_promote-apush-once.js
      - run: |
          rm tools/_promote-apush-once.js .github/workflows/_promote-apush-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote AP U.S. History [apush-promoted]"
          git push origin HEAD:subject/ap-us-history
