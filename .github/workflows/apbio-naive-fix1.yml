name: AP Biology Naive Fix 1
on:
  push:
    branches:
      - audit/ap-biology-iterative
    paths:
      - .github/workflows/apbio-naive-fix1.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/ap-biology-iterative
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Apply Biology cycle 1 repairs
        run: |
          sed -i "s/parent's genotype/parent genotype/" tools/tmp-apbio-fix1.py
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/tmp-apbio-fix1.py')
          src=path.read_text()
          start=src.index('exp_repls=[')
          end=src.index('p.write_text(s)', start)
          src=src[:start]+src[end:]
          exec(compile(src, str(path), 'exec'))
          p=Path('data/ap-biology.js')
          s=p.read_text()
          replacements={
            '"The tester must be heterozygous because two offspring phenotypes occurred."':'"The tester must be heterozygous because producing two offspring phenotypes requires it to contribute both allele types."',
            '"The DNA substitution is removed before the gene is transcribed."':'"The DNA substitution is removed by repair before transcription, so the resulting mRNA retains the original codon sequence."',
            '"A population persists only when all individuals use the same resources in the same way."':'"A population persists only when most individuals share the same resource use and therefore respond similarly to environmental change."',
            '"Having more than two population alleles means that the trait must be controlled by several genes."':'"Having more than two alleles in the population means that each individual must inherit additional copies of the same locus."',
            '"Hard seeds induce the same beneficial beak mutation in each bird before reproduction."':'"Hard seeds induce the same beneficial beak mutation in each bird, so allele frequencies change without differential reproduction."',
            '"Density dependence can be determined only from whether a factor changes carrying capacity, not from how its effect varies with density."':'"Density dependence can be determined from whether a factor reduces population size, regardless of how strongly its effect changes with density."'
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('missing balancing target: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Full repository validation
        run: npm run check
      - name: Commit repaired Biology bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ap-biology.js tests/ap-biology-naive-audit-regressions.test.js
          git diff --cached --quiet && exit 1
          git commit -m "Repair AP Biology audit findings"
          git push origin HEAD:audit/ap-biology-iterative
