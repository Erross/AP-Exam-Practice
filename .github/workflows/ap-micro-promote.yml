name: Promote AP Microeconomics
'on': [push]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-microeconomics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Promote metadata and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/subjects.js'); s=p.read_text()
          anchor='''    id: "ap-microeconomics",'''
          i=s.index(anchor)
          j=s.index('''  {\n    id: "ap-psychology",''',i)
          block=s[i:j]
          assert 'releaseStatus: "draft"' in block
          block=block.replace('releaseStatus: "draft"','releaseStatus: "released"',1)
          p.write_text(s[:i]+block+s[j:])
          t=Path('tests/ap-microeconomics.test.js'); x=t.read_text()
          assert "assert.equal(subject.releaseStatus,'draft');" in x
          t.write_text(x.replace("assert.equal(subject.releaseStatus,'draft');","assert.equal(subject.releaseStatus,'released');",1))
          d=Path('data/ap-microeconomics.js'); y=d.read_text()
          y=y.replace('// 42 original numerical/data-analysis questions. numericCheck is test-only metadata','// 43 original numerical/data-analysis questions. numericCheck is test-only metadata')
          d.write_text(y)
          PY
          rm .github/workflows/ap-micro-audit.yml
      - run: npm ci
      - name: Final released-mode Micro gate
        run: |
          node --test tests/ap-microeconomics.test.js
          node tools/subject-release-audit.js --subject ap-microeconomics --trials 5000 --overlap-trials 5000
          npm run check
      - name: Commit clean release candidate
        run: |
          rm .github/workflows/ap-micro-promote.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Release AP Microeconomics for May 2027'
          git push origin HEAD:subject/ap-microeconomics
