name: AP Business Focused Diagnostic

on:
  push:
    branches: [subject/ap-business-personal-finance-2027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run AP Business tests only
        run: node --test tests/ap-business-personal-finance-*.test.js
