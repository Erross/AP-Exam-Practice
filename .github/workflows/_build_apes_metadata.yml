name: Build APES metadata
on:
  push:
    branches: [subject/ap-environmental-science]
    paths:
      - '.github/workflows/_build_apes_metadata.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-environmental-science
      - name: Update AP Environmental Science metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('js/subjects.js')
          text = path.read_text()
          block = '''  {
    id: "ap-environmental-science",
    name: "AP Environmental Science",
    category: "Sciences",
    tier: 1,
    // VERIFIED 2026-08-17 against current AP Central course/exam pages,
    // the 2026-27 CED clarifications, Course at a Glance, and calculator policy.
    // Section I: 80 MCQs / 90 minutes / 60%. The real exam is fully digital.
    // Section II: 3 FRQs / 70 minutes / 40%. Calculator use is permitted throughout.
    mcqCount: 80,
    mcqTimeMinutes: 90,
    totalExamTimeLabel: "2h 40m",
    formatVerified: true,
    releaseStatus: "draft",
    allowsMultiSelect: false,
    calculatorAllowed: true,
    tierNote: "Includes quantitative data, qualitative models/maps, and text-source sets; calculators are permitted throughout this practice section.",
    units: [
      { id:"U1", name:"The Living World: Ecosystems", examWeight:6/80, examWeightRange:[0.06,0.08] },
      { id:"U2", name:"The Living World: Biodiversity", examWeight:6/80, examWeightRange:[0.06,0.08] },
      { id:"U3", name:"Populations", examWeight:10/80, examWeightRange:[0.10,0.15] },
      { id:"U4", name:"Earth Systems and Resources", examWeight:10/80, examWeightRange:[0.10,0.15] },
      { id:"U5", name:"Land and Water Use", examWeight:10/80, examWeightRange:[0.10,0.15] },
      { id:"U6", name:"Energy Resources and Consumption", examWeight:10/80, examWeightRange:[0.10,0.15] },
      { id:"U7", name:"Atmospheric Pollution", examWeight:7/80, examWeightRange:[0.07,0.10] },
      { id:"U8", name:"Aquatic and Terrestrial Pollution", examWeight:7/80, examWeightRange:[0.07,0.10] },
      { id:"U9", name:"Global Change", examWeight:14/80, examWeightRange:[0.15,0.20] },
    ],
    // Published MCQ science-practice bands converted to integer envelopes for 80 items.
    skillCountRanges: { "1":[24,30], "2":[10,15], "3":[5,6], "4":[2,3], "5":[10,15], "6":[5,7], "7":[14,18] },
    // Representative 2027-valid set mix within College Board's published ranges:
    // 4 quantitative-data sets, 4 qualitative/model/map sets, and 2 text-source sets.
    examBlueprint: { sets: { quantitative:4, foundational:0, text:2, visual:4 } },
    constraintDrawAttempts: 30000,
    freeResponse: {
      timeMinutes: 70,
      readingPeriodMinutes: 0,
      questions: ["Design an investigation", "Analyze and interpret quantitative data", "Analyze an environmental problem doing calculations"],
    },
    dataVar: "QUESTIONS_AP_ENVIRONMENTAL_SCIENCE",
  },'''
          pattern = r'  \{\n    id: "ap-environmental-science",.*?\n    dataVar: "QUESTIONS_AP_ENVIRONMENTAL_SCIENCE",\n  \},'
          new_text, n = re.subn(pattern, block, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one APES block, replaced {n}')
          path.write_text(new_text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js
          git commit -m "Verify AP Environmental Science 2027 metadata"
          git push origin HEAD:subject/ap-environmental-science
