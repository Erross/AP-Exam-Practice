name: AP Government Audit Fix 1
on:
  push:
    branches: [audit/ap-government-iterative]
    paths: [.github/workflows/apgov-naive-fix1.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Repair Federalist 51 coverage and weak distractors
        run: |
          python - <<'PY'
          import re,json
          p='data/ap-us-government.js'; s=open(p,encoding='utf-8').read()
          def bounds(qid):
            a=s.index('    id: '+json.dumps(qid)) if '    id: '+json.dumps(qid) in s else s.index('    "id": '+json.dumps(qid))
            candidates=[x for x in [s.find('\n  },\n  {',a),s.find('\n  }\n];',a)] if x>=0]
            return a,min(candidates)
          def edit(qid, q=None, o=None, e=None):
            global s
            a,b=bounds(qid); block=s[a:b]
            if q is not None:
              block,n=re.subn(r'(\bq:\s*)"(?:[^"\\]|\\.)*"|(\"q\":\s*)"(?:[^"\\]|\\.)*"',lambda m:(m.group(1) or m.group(2))+json.dumps(q,ensure_ascii=False),block,count=1)
              if n!=1: raise SystemExit(qid+':q')
            if o is not None:
              rendered=json.dumps(o,ensure_ascii=False,indent=2).replace('\n','\n    ')
              block,n=re.subn(r'(\bo:\s*|\"o\":\s*)\[[\s\S]*?\](?=,\n\s*(?:c:|\"c\":))',lambda m:m.group(1)+rendered,block,count=1)
              if n!=1: raise SystemExit(qid+':o')
            if e is not None:
              block,n=re.subn(r'(\be:\s*)"(?:[^"\\]|\\.)*"|(\"e\":\s*)"(?:[^"\\]|\\.)*"',lambda m:(m.group(1) or m.group(2))+json.dumps(e,ensure_ascii=False),block,count=1)
              if n!=1: raise SystemExit(qid+':e')
            s=s[:a]+block+s[b:]
          # Federalist 51: preserve Unit 1 / Topic 1.6 while actually testing the required document.
          qid='apgov-u1-014'; a,b=bounds(qid); block=s[a:b]
          m=re.search(r'(?:c:|\"c\":)\s*\[\s*(\d+)\s*\]',block); ci=int(m.group(1))
          correct='Federalist No. 51 argues that separated institutions should have constitutional means and personal motives to check one another'
          distractors=[
            'Federalist No. 51 argues that state governments should exercise the principal check on each branch of the national government',
            'Federalist No. 51 argues that frequent national referenda should resolve conflicts among the branches before policy can take effect',
            'Federalist No. 51 argues that Congress should control appointments in the executive and judicial branches to preserve legislative supremacy'
          ]; it=iter(distractors); opts=[correct if i==ci else next(it) for i in range(4)]
          edit(qid,
            q='Which statement best applies Madison’s argument in Federalist No. 51 to the Constitution’s system of checks and balances?',
            o=opts,
            e='In Federalist No. 51, Madison argues that each department must have both constitutional means and incentives to resist encroachments by the others. That logic underlies checks and balances among separately staffed institutions.')
          # Replace conspicuously absolute/cartoon distractors while preserving raw key positions.
          replacements={
            'apgov-u1-027':[
              'The national government gained greater policy control because most of the grant growth shown must have come from narrowly conditioned programs',
              'States became fiscally dependent because the grant totals grew faster than some state revenue sources over the period shown'
            ],
            'apgov-u4-016':[
              'Federalism tends to produce lower evaluations of national institutions than of state institutions, regardless of partisan control',
              'Political socialization tends to make people within the same generation hold very similar evaluations of national institutions',
              'Random sampling makes partisan subgroup estimates converge toward the same reported level of trust'
            ],
            'apgov-u5-017':[
              'Reporting both receipts and spending makes it difficult to compare actors whose money flows are organized differently',
              'The totals omit some forms of campaign activity that could also affect electoral outcomes'
            ],
            'apgov-u5-023':[
              'Incumbents usually face fewer serious primary challenges because party organizations often prefer candidates who already hold the seat',
              'District boundaries can sometimes favor an incumbent party, but incumbents do not personally control when or how maps are redrawn'
            ],
            'apgov-u1-032':[
              'Federal transfers generally trended downward after the 1970s, with only short-lived interruptions',
              'The federal share remained below one-fifth through most of the years shown before 2011'
            ],
            'apgov-u5-032':[
              'Parties face regular electoral incentives to reconsider platforms, but no constitutional rule dictates a fixed revision schedule',
              'Party platforms guide candidates and coalitions politically without operating as legally enforceable instructions to officeholders'
            ]
          }
          for qid,newds in replacements.items():
            a,b=bounds(qid); block=s[a:b]
            m=re.search(r'(?:c:|\"c\":)\s*\[\s*(\d+)\s*\]',block); ci=int(m.group(1))
            om=re.search(r'(?:\bo:\s*|\"o\":\s*)\[([\s\S]*?)\](?=,\n\s*(?:c:|\"c\":))',block)
            old=json.loads('['+om.group(1)+']')
            correct=old[ci]; it=iter(newds); opts=[]
            for i in range(4): opts.append(correct if i==ci else (next(it) if i!=ci and len(opts if False else [])>=0 else ''))
            # If only 2 or 3 specified, preserve remaining non-absolute distractor(s).
            nd=list(newds); k=0; opts=[]
            for i,x in enumerate(old):
              if i==ci: opts.append(x)
              elif k<len(nd): opts.append(nd[k]); k+=1
              else: opts.append(x)
            edit(qid,o=opts)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Add permanent Government regressions
        run: |
          cat > tests/ap-government-iterative-audit.test.js <<'EOF'
          const test=require('node:test'),assert=require('node:assert/strict'),fs=require('fs'),vm=require('vm');
          const sb={window:{}};vm.createContext(sb);vm.runInContext(fs.readFileSync('data/ap-us-government.js','utf8'),sb);const bank=sb.window.QUESTIONS_AP_US_GOVERNMENT;const q=id=>bank.find(x=>x.id===id);
          test('Government actually tests Federalist No. 51 as required Fall-2026 foundational content',()=>{
            const x=q('apgov-u1-014');assert.match(x.q,/Federalist No\. 51/);assert.match(x.o[x.c[0]],/constitutional means and personal motives to check one another/);assert.match(x.e,/Federalist No\. 51/);
          });
          test('Government audit-flagged distractors are plausible competitors rather than stacked absolutes',()=>{
            const ids=['apgov-u1-027','apgov-u4-016','apgov-u5-017','apgov-u5-023','apgov-u1-032','apgov-u5-032'];
            const abs=/\b(always|never|every|entirely|completely|impossible|guarantee[sd]?|automatically|all|none|identical)\b/i;
            for(const id of ids){const x=q(id);const n=x.o.filter((o,i)=>i!==x.c[0]&&abs.test(o)).length;assert.ok(n<2,`${id}: ${n} absolute distractors`)}
          });
          EOF
      - run: npm run check
      - name: Commit
        run: |
          git config user.name OpenAI; git config user.email openai@users.noreply.github.com
          git add data/ap-us-government.js tests/ap-government-iterative-audit.test.js
          git commit -m 'Repair AP Government foundational coverage and distractors'
          git push origin HEAD:audit/ap-government-iterative
