name: AP Human Geography preflight repair
on:
  push:
    branches: [subject/ap-human-geography]
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[preflight-aphug]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-human-geography
      - run: |
          python -c 'from pathlib import Path; p=Path("js/subjects.js"); s=p.read_text(); i=s.index("    id: \"ap-human-geography\","); j=s.index("    tierNote: null,",i); s=s[:j]+"    calculatorAllowed: false,\n"+s[j:]; p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("js/catalog.js"); s=p.read_text(); old="const calculatorText = subject.calculatorExpected === true"; new="const calculatorText = subject.calculatorAllowed === false\n      ? \"Calculator not permitted for this AP exam.\"\n      : subject.calculatorExpected === true"; s=s.replace(old,new,1); p.write_text(s)'
          rm .github/workflows/aphug-preflight-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Clarify Human Geography calculator policy"
          git push origin HEAD:subject/ap-human-geography
