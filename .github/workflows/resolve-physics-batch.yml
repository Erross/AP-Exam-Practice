name: Resolve Physics 2 Batch Merge

on:
  push:
    branches: [integration/2026-08-ap-physics-2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-physics-batch
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: integration/2026-08-ap-physics-2
          fetch-depth: 0
      - name: Merge current batch and resolve shared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp js/subjects.js /tmp/physics-subjects.js
          git fetch origin integration/2026-08-batch-release
          set +e
          git merge --no-commit --no-ff origin/integration/2026-08-batch-release
          merge_status=$?
          set -e
          conflicts=$(git diff --name-only --diff-filter=U || true)
          unexpected=$(printf '%s\n' "$conflicts" | grep -vE '^(js/subjects\.js|tests/helpers\.js)?$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected conflicts:"
            echo "$unexpected"
            exit 1
          fi
          if echo "$conflicts" | grep -q '^js/subjects.js$'; then git checkout --theirs js/subjects.js; fi
          if echo "$conflicts" | grep -q '^tests/helpers.js$'; then git checkout --theirs tests/helpers.js; fi
          node tools/resolve-physics-batch-merge.js
          git add js/subjects.js tests/helpers.js
          rm -f .github/workflows/resolve-physics-batch.yml tools/resolve-physics-batch-merge.js
          git add -A
          git commit -m "Merge August batch into AP Physics 2 integration"
          git push origin HEAD:integration/2026-08-ap-physics-2
