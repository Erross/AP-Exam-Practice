name: Micro wire two
'on': [push]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-microeconomics
      - run: node tools/micro-wire-once.js
      - run: |
          rm tools/micro-wire-once.js .github/workflows/ap-micro-wire2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire AP Microeconomics 2027 blueprint'
          git push origin HEAD:subject/ap-microeconomics
