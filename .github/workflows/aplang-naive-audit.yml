name: AP English Language Naive Audit
on:
  push:
    branches: [audit/ap-english-language-iterative]
    paths: [.github/workflows/aplang-naive-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - name: Fresh whole-bank semantic and quality audit
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('fs'),vm=require('vm');const {AP_SUBJECTS}=require('./js/subjects'),{drawExam}=require('./js/draw');const sb={window:{}};vm.createContext(sb);vm.runInContext(fs.readFileSync('data/ap-english-language.js','utf8'),sb);const bank=sb.window.QUESTIONS_AP_ENGLISH_LANGUAGE,subject=AP_SUBJECTS.find(s=>s.id==='ap-english-language');
          assert.equal(bank.length,115);assert.equal(new Set(bank.map(q=>q.id)).size,115);
          const bySkill={};for(const q of bank)(bySkill[q.topicCode]??=[]).push(q);for(const k of Object.keys(bySkill).sort()){console.log('\nSKILL',k);for(const q of bySkill[k])console.log(`${q.id} [${q.setType}] ${q.q} => ${q.o[q.c[0]]}`)}
          // 1.A should directly identify/describe rhetorical situation components/message/purpose/context, not style or method.
          for(const q of bySkill['1.A']||[])assert.match(q.q,/purpose|audience|message|writer|context|rhetorical|presents|identifies/i,q.id);
          // 5.C should ask about a method/example/comparison/development function.
          for(const q of bySkill['5.C']||[])assert.match(q.q,/function|method|example|comparison|develop|anecdote|quoted|contrast/i,q.id);
          // Writing revision/opening questions should key text that can actually appear in the draft.
          for(const q of bank.filter(q=>q.setType!=='reading')){const stem=q.q.toLowerCase();if(/which (revision|sentence|opening)|best (revision|opening)|revise sentence|add after|replace/.test(stem)){const a=q.o[q.c[0]];if(!/transition|evidence|detail|reason|method/.test(stem)){assert.match(a,/^[A-Z]/,q.id);assert.doesNotMatch(a,/^(connect|explain|identify|introduce|mention|state|add|replace|revise)\b/i,q.id)}}}
          const badWords=/\b(awesome|lonely|substance|magically|aliens?|favorite colors?|painted blue|everyone will|zero cost|no inconvenience|every athlete|never need|unrelated)\b/i;const flags=[];for(const q of bank.filter(q=>q.setType!=='reading'))q.o.forEach((o,i)=>{if(i!==q.c[0]&&badWords.test(o))flags.push([q.id,i,o])});console.log('CARTOON_FLAGS',JSON.stringify(flags));assert.equal(flags.length,0,'cartoon writing distractors remain');
          const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|a|an|of|to|and|for|is|are|in|that|with|which|what|does|when|from|be|by|on|it|this|as|at|or|has|have)\b/g,' ').replace(/\s+/g,' ').trim();const toks=s=>new Set(norm(s).split(' ').filter(x=>x.length>2));const jac=(a,b)=>{a=toks(a);b=toks(b);let n=0;for(const x of a)if(b.has(x))n++;return n/(a.size+b.size-n||1)};const pairs=[];for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++){const x=jac(bank[i].q,bank[j].q);if(x>=.55)pairs.push([x,bank[i].id,bank[j].id])}console.log('HIGH_SIMILARITY',JSON.stringify(pairs.sort((a,b)=>b[0]-a[0])));
          let ov=0,N=5000;for(let i=0;i<N;i++){const a=new Set(drawExam(subject,bank).map(q=>q.id));const b=drawExam(subject,bank);ov+=b.filter(q=>a.has(q.id)).length/45;}ov/=N;console.log('OVERLAP',ov);assert.ok(ov<=.42);
          for(let i=0;i<10000;i++){const d=drawExam(subject,bank);assert.equal(d.length,45);assert.equal(new Set(d.map(q=>q.stimulusGroupId)).size,5)}console.log('DRAWS_10000 PASS');
          NODE