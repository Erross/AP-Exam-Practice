name: AP English Literature Audit Fix 4
on:
  push:
    branches: [audit/ap-english-literature-iterative]
    paths: [.github/workflows/aplit-naive-fix4.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Make silent-communion item explicitly assess metaphor
        run: |
          python - <<'PY'
          import re,json
          p='data/ap-english-literature.js'; s=open(p,encoding='utf-8').read(); qid='aplit-sf-supper-06'
          a=s.index('    "id": '+json.dumps(qid)); b=s.find('\n  },\n  {\n    "id":',a); block=s[a:b]
          old='The phrase “silent communion” is comic chiefly because it'
          new='The metaphorical phrase “silent communion” is comic chiefly because it'
          if old not in block: raise SystemExit('target stem not found')
          block=block.replace(old,new,1);s=s[:a]+block+s[b:];open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Extend permanent exact-objective regression
        run: |
          cat >> tests/ap-english-literature-iterative-audit.test.js <<'EOF'
          test('AP Literature silent communion item explicitly assesses metaphor',()=>{
            assert.equal(q('aplit-sf-supper-06').topicCode,'6.B');
            assert.match(q('aplit-sf-supper-06').q,/metaphorical phrase/i);
          });
          EOF
      - run: npm run check
      - name: Commit
        run: |
          git config user.name OpenAI; git config user.email openai@users.noreply.github.com
          git add data/ap-english-literature.js tests/ap-english-literature-iterative-audit.test.js
          git commit -m 'Clarify AP Literature metaphor objective'
          git push origin HEAD:audit/ap-english-literature-iterative
