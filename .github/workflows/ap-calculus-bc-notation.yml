name: Apply AP Calculus BC notation repair
on:
  push:
    branches: [subject/ap-calculus-bc]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Calculus BC notation repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-calculus-bc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch-ap-calculus-bc-notation.py
      - run: node --test tests/notation-diagnostic.test.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-calculus-bc-u10.js
          git commit -m "Normalize AP Calculus BC sequence notation"
          git push origin HEAD:subject/ap-calculus-bc
