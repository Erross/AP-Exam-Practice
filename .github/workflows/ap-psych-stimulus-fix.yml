name: Psychology stimulus helper
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-psychology
      - run: python3 tools/tmp-fix-psych-stimulus.py
      - run: node --check data/ap-psychology.js
      - run: |
          rm tools/tmp-fix-psych-stimulus.py .github/workflows/ap-psych-stimulus-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use structured AP Psychology research stimuli'
          git push origin HEAD:subject/ap-psychology
