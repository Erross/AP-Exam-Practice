name: Author Physics C Mechanics

on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths:
      - tools/_author_pcm_u3_u4.py
      - .github/workflows/_author_pcm.yml

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - run: python tools/_author_pcm_u3_u4.py
      - run: rm tools/_author_pcm_u3_u4.py .github/workflows/_author_pcm.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js data/ap-physics-c-mechanics.js tools/_author_pcm_u3_u4.py .github/workflows/_author_pcm.yml
          git commit -m "Build AP Physics C Mechanics units 3 and 4"
          git push
