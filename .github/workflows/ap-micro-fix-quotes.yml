name: Fix AP Microeconomics quotes
'on': [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-microeconomics
      - name: Repair prose apostrophes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/ap-microeconomics.js')
          s=p.read_text()
          s2=re.sub(r"([A-Za-z])'([A-Za-z])", r"\1’\2", s)
          assert s2 != s
          p.write_text(s2)
          PY
      - name: Validate and commit
        run: |
          node --check data/ap-microeconomics.js
          rm .github/workflows/ap-micro-fix-quotes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair AP Microeconomics bank syntax'
          git push origin HEAD:subject/ap-microeconomics
