name: AP Statistics Naive Fix Cycle 4
on:
  push:
    branches: [subject/ap-statistics]
    paths: [.github/workflows/apstats-naive-fix-cycle4.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-statistics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Apply inference-semantic corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('data/ap-statistics.js'); s=p.read_text()
          def obj(qid):
              pat=r'(\{\n    "id": "'+re.escape(qid)+r'"[\s\S]*?\n  \})'; m=re.search(pat,s); assert m,qid; return m
          def replace_obj(qid,fn):
              global s
              m=obj(qid); x=m.group(1); y=fn(x); assert y!=x,qid; s=s[:m.start(1)]+y+s[m.end(1):]
          def replace_qa(qid,qtext,opts,correct,expl):
              def f(x):
                  repl='"q": '+repr(qtext).replace("'",'"')+',\n    "o": [\n'+''.join('      '+repr(o).replace("'",'"')+(',' if i<3 else '')+'\n' for i,o in enumerate(opts))+'    ],\n    "c": [\n      '+str(correct)+'\n    ],\n    "e": '+repr(expl).replace("'",'"')+','
                  return re.sub(r'"q": ".*?",\n    "o": \[[\s\S]*?\n    \],\n    "c": \[[\s\S]*?\n    \],\n    "e": ".*?",',repl,x,count=1)
              replace_obj(qid,f)
          replace_qa('apstats-u3-024',
            'For a two-proportion z-test of H₀: p₁=p₂, independent random samples give x₁=36 of n₁=80 and x₂=28 of n₂=70. The pooled proportion is 64/150≈0.427. Which statement correctly verifies the normality condition?',
            ['All four pooled expected counts—about 34.1, 45.9, 29.9, and 40.1—are at least 10, so the normality condition is satisfied.',
             'Only the two observed success counts matter; because 36 and 28 exceed 10, the normality condition is automatically satisfied.',
             'The condition fails because the pooled proportion is less than 0.50.',
             'The condition fails because the two sample sizes are unequal.'],0,
            'Under H₀ the large-counts check uses the pooled proportion. The expected successes and failures are 80(0.427)≈34.1, 80(0.573)≈45.9, 70(0.427)≈29.9, and 70(0.573)≈40.1; all exceed 10, so the normality condition is met.')
          def f10(x):
              assert '"skill": "4.F"' in x
              return x.replace('"skill": "4.F"','"skill": "4.G"',1)
          replace_obj('apstats-u4-010',f10)
          def f18(x):
              old='Their quantitative responses show no extreme outliers.'
              new='Both response distributions are roughly symmetric and show no extreme outliers.'
              assert old in x
              return x.replace(old,new,1)
          replace_obj('apstats-u4-018',f18)
          p.write_text(s)

          q=Path('tests/ap-statistics-quantitative-audit.test.js'); z=q.read_text()
          anchor="'apstats-u3-020','apstats-u3-025'"
          assert anchor in z; z=z.replace(anchor,"'apstats-u3-020','apstats-u3-024','apstats-u3-025'",1)
          anchor="assert.equal(answer('apstats-u3-020'),'0.08'); assert.ok(Math.abs(.62-.54-.08)<1e-12);"
          add=anchor+"\n  assert.match(answer('apstats-u3-024'),/34\\.1.*45\\.9.*29\\.9.*40\\.1/); const pc=64/150; assert.ok([80*pc,80*(1-pc),70*pc,70*(1-pc)].every(v=>v>=10));"
          assert anchor in z; z=z.replace(anchor,add,1); q.write_text(z)

          t=Path('tests/ap-statistics.test.js'); z=t.read_text(); marker="test('Statistics exact justify and estimator objectives are semantic, not family-only matches'"
          insert="""test('Statistics inference interpretation and condition skills match the exact task', () => {\n  const q=id=>bank.find(x=>x.id===id);\n  assert.deepEqual([q('apstats-u4-010').topicCode,q('apstats-u4-010').skill],['4.5','4.G']);\n  assert.match(q('apstats-u3-024').q,/verifies the normality condition/i);\n  assert.match(q('apstats-u4-018').q,/roughly symmetric.*no extreme outliers/i);\n});\n\n"""
          assert marker in z and 'Statistics inference interpretation and condition skills' not in z
          t.write_text(z.replace(marker,insert+marker,1))
          PY
      - name: Validate cycle 4 fixes
        run: npm run check
      - name: Commit cycle 4 fixes
        run: |
          git config user.name Erross
          git config user.email 33665337+Erross@users.noreply.github.com
          git add data/ap-statistics.js tests/ap-statistics.test.js tests/ap-statistics-quantitative-audit.test.js
          git commit -m "Fix Statistics inference semantic audit findings"
          git push origin HEAD:subject/ap-statistics