name: EM Clean Room Repairs
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths:
      - 'tools/_em_clean_room_repairs.py'
      - '.github/workflows/_em_clean_room_repairs.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: python tools/_em_clean_room_repairs.py
      - run: rm tools/_em_clean_room_repairs.py .github/workflows/_em_clean_room_repairs.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-physics-c-em.js tools/_em_clean_room_repairs.py .github/workflows/_em_clean_room_repairs.yml
          git commit -m "Repair E&M exact-skill semantics"
          git push origin HEAD:subject/ap-physics-c-em
