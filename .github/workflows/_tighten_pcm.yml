name: Tighten Physics C Mechanics Tests

on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths:
      - tools/_tighten_pcm_tests.py
      - .github/workflows/_tighten_pcm.yml

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - run: python tools/_tighten_pcm_tests.py
      - run: rm tools/_tighten_pcm_tests.py .github/workflows/_tighten_pcm.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ap-physics-c-mechanics.test.js tools/_tighten_pcm_tests.py .github/workflows/_tighten_pcm.yml
          git commit -m "Tighten AP Physics C Mechanics release thresholds"
          git push
