name: AP Government Naive Audit 2
on:
  push:
    branches: [audit/ap-government-iterative]
    paths: [.github/workflows/apgov-naive-audit2.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - name: Fresh independent Government audit
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),{AP_SUBJECTS}=require('./js/subjects'),{drawExam}=require('./js/draw');const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('data/ap-us-government.js','utf8'),s);const b=s.window.QUESTIONS_AP_US_GOVERNMENT,sub=AP_SUBJECTS.find(x=>x.id==='ap-us-government'),fail=m=>{throw new Error(m)};
          if(b.length!==176||new Set(b.map(q=>q.id)).size!==176)fail('cardinality');
          const hay=b.map(q=>`${q.q} ${q.e} ${q.stimulus?.title||''} ${q.stimulus?.text||''}`).join('\n').toLowerCase();
          const docs=['Declaration of Independence','Articles of Confederation','Federalist No. 10','Brutus No. 1','Federalist No. 39','Federalist No. 51','Constitution','Federalist No. 70','Federalist No. 78','Emancipation Proclamation','Gettysburg Address','Letter from a Birmingham Jail','Wealth of Nations'];for(const x of docs)if(!hay.includes(x.toLowerCase()))fail(`document ${x}`);
          const cases=['Marbury v. Madison','McCulloch v. Maryland','Schenck v. United States','Brown v. Board','Baker v. Carr','Engel v. Vitale','Gideon v. Wainwright','Tinker v. Des Moines','New York Times Co. v. United States','Wisconsin v. Yoder','Shaw v. Reno','United States v. Lopez','McDonald v. Chicago','Citizens United v. FEC'];for(const x of cases)if(!hay.includes(x.toLowerCase()))fail(`case ${x}`);if(!/dobbs v\. jackson/i.test(hay)||!/overrul/i.test(hay))fail('Dobbs status');
          const abs=/\b(always|never|every|entirely|completely|impossible|guarantee[sd]?|automatically|all|none|identical)\b/i;const bad=[];for(const q of b){if(q.o.length!==4||q.c.length!==1||q.e.length<90)fail(`${q.id} schema/rationale`);const n=q.o.filter((o,i)=>i!==q.c[0]&&abs.test(o)).length;if(n>=2)bad.push(q.id)}console.log('STACKED_ABSOLUTES',bad);if(bad.length)fail(`stacked absolutes ${bad}`);
          const wc=x=>x.trim().split(/\s+/).length;let ul=0,al=0,cw=0,dw=0;const pos=[0,0,0,0];for(const q of b){const ls=q.o.map(wc),m=Math.max(...ls),c=q.c[0];pos[c]++;cw+=ls[c];ls.forEach((n,i)=>{if(i!==c)dw+=n});if(ls[c]===m)al++;if(ls[c]===m&&ls.filter(x=>x===m).length===1)ul++}const ca=cw/b.length,da=dw/(b.length*3);console.log('BIAS',ul/b.length,al/b.length,ca,da,pos);if(ul/b.length>.25||al/b.length>.58||Math.abs(ca-da)/da>.12||pos.some(x=>x/b.length<.15||x/b.length>.35))fail('bias');
          const tok=x=>new Set(x.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(t=>t.length>3)),jac=(a,c)=>{const A=tok(a),B=tok(c),u=new Set([...A,...B]).size;return u?[...A].filter(x=>B.has(x)).length/u:0};const st=b.filter(q=>!q.stimulusGroupId),near=[];for(let i=0;i<st.length;i++)for(let j=i+1;j<st.length;j++)if(st[i].unit===st[j].unit&&st[i].topic===st[j].topic&&jac(st[i].q,st[j].q)>=.55)near.push([st[i].id,st[j].id]);console.log('NEAR',near);if(near.length)fail('near duplicates');
          for(let i=0;i<10000;i++){const d=drawExam(sub,b);if(d.length!==55)fail('draw length');for(const u of sub.units){const z=d.filter(q=>q.unit===u.id).length/55;if(z<u.examWeightRange[0]||z>u.examWeightRange[1])fail(`${u.id} ${z}`)}const v=new Set();for(const q of d)if(q.variantGroupId){if(v.has(q.variantGroupId))fail(`variant ${q.variantGroupId}`);v.add(q.variantGroupId)}}
          let ov=0;for(let i=0;i<10000;i++){const a=new Set(drawExam(sub,b).map(q=>q.id));ov+=drawExam(sub,b).filter(q=>a.has(q.id)).length/55}ov/=10000;console.log('OVERLAP',ov);if(ov>.40)fail(`overlap ${ov}`);console.log('FINAL_GOV_CLEANROOM_PASS');
          NODE
