name: Apply AP Art History deterministic drawer
on:
  push:
    branches: [subject/ap-art-history]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add deterministic Art History draw patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/patch-ap-art-history-drawer.py
      - run: npm ci
      - run: node --test tests/ap-art-history-bank.test.js tests/ap-art-history-draw.test.js tests/notation-diagnostic.test.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/draw.js js/subjects.js tests/ap-art-history-bank.test.js
          git commit -m "Use deterministic AP Art History exam construction"
          git push origin HEAD:subject/ap-art-history
