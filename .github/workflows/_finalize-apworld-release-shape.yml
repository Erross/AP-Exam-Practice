name: Temporary AP World release-shape finalizer
on:
  push:
    branches: [subject/ap-world-history]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[apworld-shape-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-world-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_finalize-apworld-release-shape.js
      - run: |
          rm tools/_finalize-apworld-release-shape.js .github/workflows/_finalize-apworld-release-shape.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize AP World browser-effective draft [apworld-shape-finalized]"
          git push origin HEAD:subject/ap-world-history
