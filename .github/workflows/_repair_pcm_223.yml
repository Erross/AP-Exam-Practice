name: Repair Physics C Mechanics 2.2.03
on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths:
      - 'tools/_repair_pcm_223.py'
      - '.github/workflows/_repair_pcm_223.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - run: python tools/_repair_pcm_223.py
      - run: rm tools/_repair_pcm_223.py .github/workflows/_repair_pcm_223.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-physics-c-mechanics.js tools/_repair_pcm_223.py .github/workflows/_repair_pcm_223.yml
          git commit -m "Repair Mechanics centripetal distractor wording"
          git push
