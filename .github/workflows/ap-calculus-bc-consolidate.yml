name: Consolidate AP Calculus BC bank
on:
  push:
    branches: [subject/ap-calculus-bc]
permissions:
  contents: write
jobs:
  consolidate:
    if: github.event.head_commit.message == 'Consolidate Calculus BC shipping bank'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-calculus-bc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tools/consolidate-ap-calculus-bc.js
      - run: git rm data/ap-calculus-bc-u6-u8.js data/ap-calculus-bc-u9.js data/ap-calculus-bc-u10.js
      - run: node --test tests/ap-calculus-bc.test.js tests/ap-calculus-bc-cleanroom.test.js tests/notation-diagnostic.test.js
      - run: npm run release:audit -- --subject ap-calculus-bc --trials 5000 --overlap-trials 5000
      - run: npm run check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-calculus-bc.js index.html
          git commit -m "Consolidate AP Calculus BC into standalone shipping bank"
          git push origin HEAD:subject/ap-calculus-bc
