name: Correct AP Microeconomics CED provenance
'on': [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-microeconomics
      - name: Correct provenance wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'js/subjects.js': [('VERIFIED 2026-08-15 against the AP Microeconomics CED effective Fall 2026','VERIFIED 2026-08-15 against the current AP Microeconomics framework (Fall 2022 CED; no changes announced)')],
            'tests/ap-microeconomics.test.js': [('exact Fall-2026 CED inventory','exact current CED inventory')],
          }
          for name,pairs in replacements.items():
            p=Path(name); s=p.read_text()
            for old,new in pairs:
              assert old in s, (name,old)
              s=s.replace(old,new)
            p.write_text(s)
          PY
      - name: Commit clean correction
        run: |
          rm .github/workflows/ap-micro-provenance-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Correct AP Microeconomics CED provenance'
          git push origin HEAD:subject/ap-microeconomics
