name: Resolve Calculus Batch Merge

on:
  push:
    branches: [subject/ap-calculus-ab]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resolve-calculus-batch
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: subject/ap-calculus-ab
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Merge current batch and resolve known conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration/2026-08-batch-release
          set +e
          git merge --no-commit --no-ff origin/integration/2026-08-batch-release
          merge_status=$?
          set -e
          conflicts=$(git diff --name-only --diff-filter=U || true)
          unexpected=$(printf '%s\n' "$conflicts" | grep -vE '^(README\.md|js/draw\.js|style\.css)?$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected conflicts:"
            echo "$unexpected"
            exit 1
          fi
          git checkout --theirs README.md js/draw.js style.css
          git checkout origin/integration/2026-08-batch-release -- package-lock.json
          node tools/resolve-calculus-batch-merge.js
          rm -f tools/calculus-batch-conflicts.txt tools/resolve-calculus-batch-merge.js .github/workflows/resolve-calculus-batch.yml
          git add -A
      - run: npm ci
      - run: npm run check
      - name: Commit resolved Calculus merge
        run: |
          git commit -m "Merge August batch into AP Calculus AB"
          git push origin HEAD:subject/ap-calculus-ab
