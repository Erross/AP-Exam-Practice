name: Diagnose Calculus Batch Merge

on:
  push:
    branches: [subject/ap-calculus-ab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: subject/ap-calculus-ab
          fetch-depth: 0
      - name: Capture conflict list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin integration/2026-08-batch-release
          set +e
          git merge --no-commit --no-ff origin/integration/2026-08-batch-release
          merge_status=$?
          set -e
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
          git merge --abort || true
          {
            echo "merge_status=$merge_status"
            cat /tmp/conflicts.txt
          } > tools/calculus-batch-conflicts.txt
          rm -f .github/workflows/diagnose-calculus-batch.yml
          git add -A
          git commit -m "Record Calculus batch merge conflicts"
          git push origin HEAD:subject/ap-calculus-ab
