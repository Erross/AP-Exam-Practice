name: Psychology wire helper
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-psychology
      - run: python3 tools/tmp-wire-psych.py
      - run: node --check data/ap-psychology.js
      - run: |
          rm tools/tmp-wire-psych.py .github/workflows/ap-psych-wire2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire AP Psychology 2027 blueprint'
          git push origin HEAD:subject/ap-psychology
