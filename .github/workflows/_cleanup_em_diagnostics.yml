name: Cleanup EM Diagnostics
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_cleanup_em_diagnostics.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: rm -f tools/_diag_em_counts.js tools/_diag_em_feasibility.js .github/workflows/_diag_em_counts.yml .github/workflows/_diag_em_feasibility.yml .github/workflows/_diag_em_tags.yml .github/workflows/_cleanup_em_diagnostics.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove completed E&M diagnostics"
          git push origin HEAD:subject/ap-physics-c-em
