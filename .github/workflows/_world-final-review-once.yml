name: One-shot AP World final-review hardening
on:
  push:
    branches: [subject/ap-world-history]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[world-final-review-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-world-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_world-final-review-once.js
      - run: |
          rm tools/_world-final-review-once.js .github/workflows/_world-final-review-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden AP World final-review distractors [world-final-review-done]"
          git push origin HEAD:subject/ap-world-history
