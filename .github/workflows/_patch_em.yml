name: Patch AP Physics C E&M metadata
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_patch_em.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: python tools/_patch_em.py
      - run: rm tools/_patch_em.py .github/workflows/_patch_em.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js tools/_patch_em.py .github/workflows/_patch_em.yml
          git commit -m "Wire AP Physics C E&M 2027 blueprint"
          git push origin HEAD:subject/ap-physics-c-em
