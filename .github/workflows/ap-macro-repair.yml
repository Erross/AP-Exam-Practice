name: Macro rationale repair
'on': [push]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-macroeconomics
      - run: node tools/macro-rationale-repair-once.js
      - run: |
          rm tools/macro-rationale-repair-once.js .github/workflows/ap-macro-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden AP Macroeconomics rationales'
          git push origin HEAD:subject/ap-macroeconomics
