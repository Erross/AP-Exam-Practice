name: AP English Language Audit Fix 2
on:
  push:
    branches: [audit/ap-english-language-iterative]
    paths: [.github/workflows/aplang-naive-fix2.yml]
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Harden remaining writing distractors
        run: |
          python - <<'PY'
          import re,json
          p='data/ap-english-language.js'; s=open(p,encoding='utf-8').read()
          def edit(qid, opts):
            global s
            a=s.index('    "id": '+json.dumps(qid)); b=s.find('\n  },\n  {\n    "id":',a)
            if b<0:b=s.find('\n  }\n];',a)
            block=s[a:b]
            rendered=json.dumps(opts,ensure_ascii=False,indent=2).replace('\n','\n    ')
            block,n=re.subn(r'(    "o": )\[[\s\S]*?\](?=,\n    "c")',lambda m:m.group(1)+rendered,block,count=1)
            if n!=1:raise SystemExit(qid)
            s=s[:a]+block+s[b:]
          edit('aplang-w-fridge-03',["A health-department report showing that monitored refrigerators stayed within safe temperature ranges","A survey showing that recreation-center visitors support reducing food waste","Records from nearby programs showing that their longest interruptions followed missed temperature checks","A budget estimate showing that electricity for the refrigerator would be a small share of recreation-center operating costs"])
          edit('aplang-w-start-02',["an estimate of how many families currently rely on dismissal-time child-care arrangements","a survey of families about conflicts a later dismissal could create for after-school care","a comparison of athletic-practice start times at neighboring districts with later school starts","a statement from transportation staff about whether existing bus routes could accommodate a later dismissal"])
          edit('aplang-w-start-03',["A sleep-medicine review explaining adolescent circadian shifts and recommended sleep duration","Attendance records comparing first-period tardiness with later-period tardiness","A student survey reporting average bedtime and wake time on school nights","A district report comparing academic outcomes before and after a previous schedule adjustment"])
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Extend permanent regression
        run: |
          cat >> tests/ap-english-language-iterative-audit.test.js <<'EOF'
          test('AP Language second-pass writing distractors are substantive alternatives',()=>{
            const forbidden=/painted blue|unrelated to school start times|every athlete will oppose/i;
            for(const id of ['aplang-w-fridge-03','aplang-w-start-02','aplang-w-start-03']){
              const x=q(id);
              assert.equal(new Set(x.o).size,4,id);
              assert.ok(x.o.every(a=>a.split(/\s+/).length>=6),id);
              assert.ok(x.o.every(a=>!forbidden.test(a)),id);
            }
          });
          EOF
      - run: npm run check
      - name: Commit
        run: |
          git config user.name OpenAI; git config user.email openai@users.noreply.github.com
          git add data/ap-english-language.js tests/ap-english-language-iterative-audit.test.js
          git commit -m 'Harden remaining AP English Language distractors'
          git push origin HEAD:audit/ap-english-language-iterative