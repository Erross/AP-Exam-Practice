name: CSA final lexical fix
on:
  push:
    paths:
      - '.github/workflows/_csa-final-lexical-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-computer-science-a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node tools/_csa-final-lexical-fix.js
      - run: |
          rm tools/_csa-final-lexical-fix.js .github/workflows/_csa-final-lexical-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ap-computer-science-a-quality-fixes.js tools/_csa-final-lexical-fix.js .github/workflows/_csa-final-lexical-fix.yml
          git commit -m 'Fix final CSA absolute-language false positives'
          git push origin HEAD:subject/ap-computer-science-a
