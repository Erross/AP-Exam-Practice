name: Macro full release gate
'on': [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/ap-macroeconomics.test.js
      - run: node tools/subject-release-audit.js --subject ap-macroeconomics --trials 5000 --overlap-trials 5000
      - run: npm run check
