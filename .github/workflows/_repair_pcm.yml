name: Repair Physics C Mechanics

on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths:
      - tools/_repair_pcm_absolute_scan.py
      - .github/workflows/_repair_pcm.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - run: python tools/_repair_pcm_absolute_scan.py
      - run: rm tools/_repair_pcm_absolute_scan.py .github/workflows/_repair_pcm.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-physics-c-mechanics.js tests/ap-physics-c-mechanics.test.js tools/_repair_pcm_absolute_scan.py .github/workflows/_repair_pcm.yml
          git commit -m "Harden Physics C Mechanics rolling distractors"
          git push
