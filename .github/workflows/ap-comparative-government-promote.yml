name: Promote AP Comparative Government
on:
  push:
    branches: [subject/ap-comparative-government]
permissions:
  contents: write
jobs:
  promote:
    if: github.event.head_commit.message == 'Promote AP Comparative Government release candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-comparative-government
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote only Comparative Government metadata and regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/subjects.js'); s=p.read_text()
          anchor='id: "ap-comparative-government"'
          i=s.index(anchor); j=s.index('dataVar: "QUESTIONS_AP_COMPARATIVE_GOVERNMENT"',i)
          block=s[i:j]
          if 'releaseStatus: "draft"' not in block: raise SystemExit('Comparative Government draft flag not found')
          block=block.replace('releaseStatus: "draft"','releaseStatus: "released"',1)
          s=s[:i]+block+s[j:]; p.write_text(s)
          p=Path('tests/ap-comparative-government.test.js'); s=p.read_text()
          old="assert.equal(subject.releaseStatus, 'draft');"
          if old not in s: raise SystemExit('draft test assertion not found')
          p.write_text(s.replace(old,"assert.equal(subject.releaseStatus, 'released');",1))
          PY
          rm .github/workflows/ap-comparative-government-promote.yml
      - run: npm ci
      - name: Final released-mode 5k gate
        run: npm run release:audit -- --subject ap-comparative-government --trials 5000 --overlap-trials 5000
      - name: Full released-mode repository gate
        run: npm run check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Release AP Comparative Government for May 2027"
          git push origin HEAD:subject/ap-comparative-government
