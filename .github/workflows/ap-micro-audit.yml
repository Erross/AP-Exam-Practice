name: Audit AP Microeconomics
'on': [push]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-microeconomics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Micro release regressions
        run: node --test tests/ap-microeconomics.test.js
      - name: Run 5k release audit
        run: node tools/subject-release-audit.js --subject ap-microeconomics --trials 5000 --overlap-trials 5000
      - name: Run full repository gate
        run: npm run check
