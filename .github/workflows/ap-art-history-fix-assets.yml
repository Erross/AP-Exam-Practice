name: Correct AP Art History assets
on:
  push:
    branches: [subject/ap-art-history]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Apply Art History asset identity corrections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python tools/fix-ap-art-history-assets.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+Erross@users.noreply.github.com
          git add assets/ap-art-history data/ap-art-history-u10.js
          git commit -m "Correct Art History visual identities"
          git push origin HEAD:subject/ap-art-history
