name: AP English Literature Naive Audit
on:
  push:
    branches: [audit/ap-english-literature-iterative]
    paths: [.github/workflows/aplit-naive-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Inspect watch and room source language
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),{AP_SUBJECTS}=require('./js/subjects');const s={window:{}};vm.createContext(s);vm.runInContext(fs.readFileSync('data/ap-english-literature.js','utf8'),s);const bank=s.window[AP_SUBJECTS.find(x=>x.id==='ap-english-literature').dataVar];
          for(const gid of ['aplit-g-sf-watch','aplit-g-sf-room']){const qs=bank.filter(q=>q.stimulusGroupId===gid); console.log('\nGROUP',gid);console.log(qs[0].stimulus.text);for(const q of qs)console.log(q.id,q.topicCode,'c='+q.c[0],q.q,'=>',q.o[q.c[0]])}
          NODE