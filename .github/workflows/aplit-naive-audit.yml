name: AP English Literature Naive Audit
on:
  push:
    branches: [audit/ap-english-literature-iterative]
    paths: [.github/workflows/aplit-naive-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - run: npm run check
      - name: Independent whole-bank audit
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('fs'),vm=require('vm');
          const {AP_SUBJECTS}=require('./js/subjects'),{drawExam}=require('./js/draw');
          const subject=AP_SUBJECTS.find(s=>s.id==='ap-english-literature');
          const sb={window:{}};vm.createContext(sb);vm.runInContext(fs.readFileSync('data/ap-english-literature.js','utf8'),sb);
          const bank=sb.window[subject.dataVar];
          console.log('BANK',subject.dataVar,bank.length);
          assert.ok(Array.isArray(bank));assert.equal(new Set(bank.map(q=>q.id)).size,bank.length);
          const bySkill={};for(const q of bank)(bySkill[q.topicCode]??=[]).push(q);
          for(const k of Object.keys(bySkill).sort()){console.log('\nSKILL',k,'COUNT',bySkill[k].length);for(const q of bySkill[k])console.log(`${q.id} [${q.setType}/${q.era}] ${q.q} => ${q.o[q.c[0]]}`)}
          for(const q of bank){assert.equal(q.o.length,4,q.id);assert.equal(q.c.length,1,q.id);assert.ok(q.e&&q.e.length>=90,q.id);assert.equal(new Set(q.o).size,4,q.id)}
          const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(the|a|an|of|to|and|for|is|are|in|that|with|which|what|does|when|from|be|by|on|it|this|as|at|or|has|have|chiefly|most|best)\b/g,' ').replace(/\s+/g,' ').trim();
          const toks=s=>new Set(norm(s).split(' ').filter(x=>x.length>2));const jac=(a,b)=>{a=toks(a);b=toks(b);let n=0;for(const x of a)if(b.has(x))n++;return n/(a.size+b.size-n||1)};
          const pairs=[];for(let i=0;i<bank.length;i++)for(let j=i+1;j<bank.length;j++){const x=jac(bank[i].q,bank[j].q);if(x>=.55)pairs.push([+x.toFixed(3),bank[i].id,bank[j].id])}console.log('HIGH_SIMILARITY',JSON.stringify(pairs.sort((a,b)=>b[0]-a[0])));
          const bad=/\b(obviously|always|never|completely unrelated|random fact|favorite color|aliens?|magic(?:ally)?|because it rhymes|no effect|only because)\b/i;const flags=[];for(const q of bank)q.o.forEach((o,i)=>{if(i!==q.c[0]&&bad.test(o))flags.push([q.id,i,o])});console.log('CARTOON_FLAGS',JSON.stringify(flags));
          const sources=new Map();for(const q of bank){const s=q.stimulus;if(s&&s.source){const key=q.stimulusGroupId; if(!sources.has(key))sources.set(key,s.source)}}console.log('STIMULI',sources.size);for(const [k,v] of sources)console.log(k,'=>',v);
          let ov=0,N=5000;for(let i=0;i<N;i++){const a=new Set(drawExam(subject,bank).map(q=>q.id));const b=drawExam(subject,bank);ov+=b.filter(q=>a.has(q.id)).length/55;}ov/=N;console.log('OVERLAP',ov);assert.ok(ov<=.40);
          for(let i=0;i<10000;i++){const d=drawExam(subject,bank);assert.equal(d.length,55);const sets=new Set(d.map(q=>q.stimulusGroupId));assert.equal(sets.size,5)}console.log('DRAWS_10000 PASS');
          NODE