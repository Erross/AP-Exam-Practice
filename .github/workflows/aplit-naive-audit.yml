name: AP English Literature Naive Audit
on:
  push:
    branches: [audit/ap-english-literature-iterative]
    paths: [.github/workflows/aplit-naive-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Full repository validation
        run: npm run check
      - name: Independent clean-room Literature audit
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const {AP_SUBJECTS}=require('./js/subjects');
          const {drawExam}=require('./js/draw');
          const sb={window:{}};vm.createContext(sb);vm.runInContext(fs.readFileSync('data/ap-english-literature.js','utf8'),sb);
          const subject=AP_SUBJECTS.find(x=>x.id==='ap-english-literature');
          const bank=sb.window[subject.dataVar];
          const fail=m=>{throw new Error(m)};
          if(bank.length!==142)fail(`bank length ${bank.length}`);
          if(new Set(bank.map(q=>q.id)).size!==bank.length)fail('duplicate ids');
          const allowed=new Set(['1.A','1.B','1.C','1.D','1.E','2.B','3.B','3.C','3.D','3.E','4.A','4.B','4.C','5.B','5.C','5.D','6.A','6.B','6.C','6.D','7.B','7.C','7.D']);
          for(const q of bank){
            if(!allowed.has(q.topicCode))fail(`${q.id}: invalid skill ${q.topicCode}`);
            if(q.skill!==q.topicCode.split('.')[0])fail(`${q.id}: skill/category mismatch`);
            if(!Array.isArray(q.o)||q.o.length!==4||!Array.isArray(q.c)||q.c.length!==1)fail(`${q.id}: option/key schema`);
            if(new Set(q.o.map(x=>x.trim().toLowerCase())).size!==4)fail(`${q.id}: duplicate options`);
            if(q.e.length<90)fail(`${q.id}: short rationale`);
            if(!q.stimulus||!q.stimulusGroupId)fail(`${q.id}: missing stimulus`);
            if(!/^Public-domain text: https:\/\//.test(q.stimulus.source))fail(`${q.id}: unsourced/non-public-domain stimulus`);
          }
          const groups=new Map();for(const q of bank){if(!groups.has(q.stimulusGroupId))groups.set(q.stimulusGroupId,[]);groups.get(q.stimulusGroupId).push(q)}
          if(groups.size!==13)fail(`group count ${groups.size}`);
          const types={};for(const qs of groups.values()){const t=qs[0].setType;types[t]=(types[t]||0)+1;if(new Set(qs.map(q=>q.stimulus)).size!==1)fail(`${qs[0].stimulusGroupId}: stimulus object mismatch`)}
          if(JSON.stringify(types)!==JSON.stringify({'short-fiction':5,'poetry':5,'longer-drama':3}))fail(`set composition ${JSON.stringify(types)}`);

          const wc=s=>s.trim().split(/\s+/).length;let uniqueLongest=0,amongLongest=0,cw=0,dw=0;const pos=[0,0,0,0];
          for(const q of bank){const ls=q.o.map(wc),mx=Math.max(...ls),ci=q.c[0];pos[ci]++;cw+=ls[ci];ls.forEach((n,i)=>{if(i!==ci)dw+=n});if(ls[ci]===mx)amongLongest++;if(ls[ci]===mx&&ls.filter(n=>n===mx).length===1)uniqueLongest++;const abs=q.o.filter((o,i)=>i!==ci&&/\b(every|always|never|unlimited|identical|entirely|certainly|definitely|guarantee[sd]?|impossible|completely|none)\b/i.test(o));if(abs.length>=2)fail(`${q.id}: stacked absolute distractors`)}
          const ca=cw/bank.length,da=dw/(bank.length*3);console.log('BIAS',JSON.stringify({uniqueLongest:uniqueLongest/bank.length,amongLongest:amongLongest/bank.length,correctAvg:ca,distractorAvg:da,keyPositions:pos}));
          if(uniqueLongest/bank.length>.25||amongLongest/bank.length>.58||Math.abs(ca-da)/da>.12)fail('answer-length bias threshold exceeded');
          for(const n of pos)if(n/bank.length<.15||n/bank.length>.35)fail('raw key position imbalance');

          const toks=s=>new Set(s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(x=>x.length>3));
          const jac=(a,b)=>{const A=toks(a),B=toks(b),I=[...A].filter(x=>B.has(x)).length,U=new Set([...A,...B]).size;return U?I/U:0};
          const suspects=[];for(const qs of groups.values())for(let i=0;i<qs.length;i++)for(let j=i+1;j<qs.length;j++){const z=jac(qs[i].q,qs[j].q);if(z>=.58)suspects.push([z.toFixed(3),qs[i].id,qs[j].id])}
          console.log('NEAR_DUPLICATE_REPORT',JSON.stringify(suspects));

          for(const skill of [...allowed].sort()){
            console.log(`\n=== SKILL ${skill} ===`);
            for(const q of bank.filter(x=>x.topicCode===skill))console.log(`${q.id} :: ${q.q} => ${q.o[q.c[0]]}`);
          }

          const text=q=>`${q.q} ${q.o[q.c[0]]} ${q.e}`;
          for(const q of bank.filter(x=>x.topicCode==='2.B'))if(!/setting|place|estate|house|room|bridge|kitchen|domestic|environment|L['’]Abri|country spot|carnival|flat|Christmas/i.test(text(q)))fail(`${q.id}: 2.B setting semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='5.C'))if(!/symbol|symboliz|repres|embod|stands for/i.test(text(q)))fail(`${q.id}: 5.C symbol semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='5.D'))if(!/image|imagery|visual/i.test(text(q)))fail(`${q.id}: 5.D imagery semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='6.A'))if(!/simile|comparison|compar|\blike\b|\bas\b/i.test(text(q)))fail(`${q.id}: 6.A simile semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='6.B'))if(!/metaphor/i.test(text(q)))fail(`${q.id}: 6.B metaphor semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='6.C'))if(!/personif/i.test(text(q)))fail(`${q.id}: 6.C personification semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='6.D'))if(!/allusion/i.test(text(q)))fail(`${q.id}: 6.D allusion semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='7.C'))if(!/commentary/i.test(q.q)||!/claim|thesis|evidence|reason/i.test(text(q)))fail(`${q.id}: 7.C commentary reasoning semantics weak`);
          for(const q of bank.filter(x=>x.topicCode==='7.D'))if(!/detail|evidence/i.test(q.q)||!/support/i.test(q.q))fail(`${q.id}: 7.D evidence-selection semantics weak`);

          for(let i=0;i<10000;i++){
            const d=drawExam(subject,bank);if(d.length!==55)fail('draw length');
            const t={};for(const x of d){t[x.setType]=(t[x.setType]||new Set());t[x.setType].add(x.stimulusGroupId)}
            const counts=Object.fromEntries(Object.entries(t).map(([k,v])=>[k,v.size]));if(JSON.stringify(counts)!==JSON.stringify({'short-fiction':2,'poetry':2,'longer-drama':1}))fail(`draw set composition ${JSON.stringify(counts)}`);
            const cats={};for(const x of d)cats[x.skill]=(cats[x.skill]||0)+1;
            if(JSON.stringify(cats)!==JSON.stringify({'1':9,'2':3,'3':10,'4':14,'5':7,'6':6,'7':6}))fail(`draw skill blueprint ${JSON.stringify(cats)}`);
          }
          let ov=0;const pairs=10000;for(let i=0;i<pairs;i++){const a=new Set(drawExam(subject,bank).map(q=>q.id));ov+=drawExam(subject,bank).filter(q=>a.has(q.id)).length/55}ov/=pairs;console.log('OVERLAP',ov);if(ov>.42)fail(`overlap ${ov}`);
          console.log('FINAL_CLEANROOM_PASS');
          NODE
