name: Apply AP Art History clean-room repairs
on:
  push:
    branches: [subject/ap-art-history]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Add Art History clean-room semantic repairs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-art-history
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/ap-art-history-cleanroom-repair.py
      - run: npm ci
      - run: node --test tests/ap-art-history-bank.test.js tests/ap-art-history-draw.test.js tests/notation-diagnostic.test.js
      - run: npm run release:audit -- --subject ap-art-history --trials 1000 --overlap-trials 1000
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-art-history-finalize.js
          git commit -m "Strengthen AP Art History skill semantics"
          git push origin HEAD:subject/ap-art-history
