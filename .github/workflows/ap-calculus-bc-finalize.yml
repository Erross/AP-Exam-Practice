name: Finalize AP Calculus BC release candidate
on:
  push:
    branches: [subject/ap-calculus-bc]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Calculus BC release candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-calculus-bc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Promote metadata and release regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/subjects.js')
          s=p.read_text()
          start=s.index('    id: "ap-calculus-bc",')
          end=s.index('  {\n    id: "ap-computer-science-a",', start)
          block=s[start:end]
          if 'releaseStatus: "draft"' not in block:
              raise SystemExit('BC draft releaseStatus not found')
          block=block.replace('releaseStatus: "draft"','releaseStatus: "released"',1)
          p.write_text(s[:start]+block+s[end:])

          p=Path('tests/ap-calculus-bc.test.js')
          s=p.read_text().replace('Calculus BC draft metadata matches','Calculus BC released metadata matches',1)
          s=s.replace('assert.equal(subject.releaseStatus, "draft");','assert.equal(subject.releaseStatus, "released");',1)
          p.write_text(s)
          PY
      - name: Remove one-off Calculus BC development machinery
        run: |
          rm -f \
            .apcalcbc-audit-trigger \
            .apcalcbc-cleanroom-trigger \
            .apcalcbc-consolidate-trigger \
            .apcalcbc-diagnostic-trigger \
            .apcalcbc-notation-trigger \
            .apcalcbc-wiring-trigger \
            tools/ap-calculus-bc-diagnostics.js \
            tools/ap-calculus-bc-generic-gate-repair.py \
            tools/consolidate-ap-calculus-bc.js \
            tools/patch-ap-calculus-bc-notation.py \
            tools/patch-ap-calculus-bc-wiring.py \
            tools/patch-release-audit-four-way-ties.py
          rm -f .github/workflows/ap-calculus-bc-*.yml
      - run: node --test tests/ap-calculus-bc.test.js tests/ap-calculus-bc-cleanroom.test.js tests/ap-calculus-bc-naive-audit-regressions.test.js tests/catalog-preflight.test.js tests/notation-diagnostic.test.js tests/subject-release-audit.test.js
      - run: npm run release:audit -- --subject ap-calculus-bc --trials 5000 --overlap-trials 5000
      - run: npm run check
      - name: Commit exact release candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize AP Calculus BC release candidate"
          git push origin HEAD:subject/ap-calculus-bc
