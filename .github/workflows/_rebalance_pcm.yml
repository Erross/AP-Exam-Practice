name: Rebalance Physics C Mechanics
on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths:
      - 'tools/_rebalance_pcm_options.py'
      - '.github/workflows/_rebalance_pcm.yml'
permissions:
  contents: write
jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - run: python tools/_rebalance_pcm_options.py
      - run: rm tools/_rebalance_pcm_options.py .github/workflows/_rebalance_pcm.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ap-physics-c-mechanics.js tools/_rebalance_pcm_options.py .github/workflows/_rebalance_pcm.yml
          git commit -m "Rebalance AP Physics C Mechanics distractor quality"
          git push
