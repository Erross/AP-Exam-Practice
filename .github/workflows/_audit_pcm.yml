name: Audit Physics C Mechanics

on:
  push:
    branches: [subject/ap-physics-c-mechanics]
    paths:
      - .github/workflows/_audit_pcm.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-mechanics
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run 5000-trial release audit
        run: npm run release:audit -- --subject ap-physics-c-mechanics --trials 5000 --overlap-trials 5000
      - name: Remove one-time audit workflow
        if: always()
        run: rm .github/workflows/_audit_pcm.yml
      - name: Commit workflow cleanup
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/_audit_pcm.yml
          git commit -m "Remove one-time Physics C Mechanics audit workflow"
          git push
