name: Promote AP Physics 1

on:
  push:
    branches:
      - release/ap-physics-1-promote

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message != 'Promote AP Physics 1 to released'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply promotion
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const subjectsPath = 'js/subjects.js';
          let subjects = fs.readFileSync(subjectsPath, 'utf8');
          const physicsStart = subjects.indexOf('    id: "ap-physics-1",');
          const physicsEnd = subjects.indexOf('    id: "ap-physics-2",', physicsStart);
          if (physicsStart < 0 || physicsEnd < 0) throw new Error('Could not locate Physics 1 block');
          const before = subjects.slice(0, physicsStart);
          let physics = subjects.slice(physicsStart, physicsEnd);
          const oldStatus = '    releaseStatus: "draft",';
          if (!physics.includes(oldStatus)) throw new Error('Physics 1 draft status not found');
          physics = physics.replace(oldStatus, '    releaseStatus: "released",');
          subjects = before + physics + subjects.slice(physicsEnd);
          fs.writeFileSync(subjectsPath, subjects);

          const testPath = 'tests/ap-physics-1.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldAssertion = 'assert.equal(subject.releaseStatus, "draft");';
          if (!test.includes(oldAssertion)) throw new Error('Physics 1 draft assertion not found');
          test = test.replace(oldAssertion, 'assert.equal(subject.releaseStatus, "released");');
          test = test.replace('the in-progress Physics 1 bank uses only MCQ-assessed skills and sound schema', 'the released Physics 1 bank uses only MCQ-assessed skills and sound schema');
          fs.writeFileSync(testPath, test);

          const evidencePath = 'release-evidence/ap-physics-1-2027.md';
          let evidence = fs.readFileSync(evidencePath, 'utf8');
          const marker = '## Remaining release gates';
          const markerIndex = evidence.indexOf(marker);
          if (markerIndex < 0) throw new Error('Release evidence remaining-gates section not found');
          evidence = evidence.slice(0, markerIndex) + `## Promotion\n\nPromoted to \`releaseStatus: "released"\` on 2026-08-17 after the fresh independent review and exact-head candidate CI passed. The promotion is intentionally limited to release state, its regression assertion, and this evidence update. The released-mode PR must pass the full repository gate before merging to \`main\`, followed by exact-main Pages deployment and public smoke verification.\n`;
          fs.writeFileSync(evidencePath, evidence);
          NODE
      - name: Remove one-time workflow
        run: rm .github/workflows/promote-physics1.yml
      - name: Commit promotion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/subjects.js tests/ap-physics-1.test.js release-evidence/ap-physics-1-2027.md .github/workflows/promote-physics1.yml
          git commit -m "Promote AP Physics 1 to released"
          git push origin HEAD:release/ap-physics-1-promote
