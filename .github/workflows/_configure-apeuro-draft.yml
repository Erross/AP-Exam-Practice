name: Configure AP Euro Draft
on:
  push:
    branches: [subject/ap-european-history]
    paths:
      - '.github/workflows/_configure-apeuro-draft.yml'
permissions:
  contents: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: subject/ap-european-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/_configure-apeuro-draft.js
      - name: Commit configured draft and remove temporary helper
        run: |
          rm tools/_configure-apeuro-draft.js .github/workflows/_configure-apeuro-draft.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/subjects.js data/ap-european-history-u*.js tools/_configure-apeuro-draft.js .github/workflows/_configure-apeuro-draft.yml
          git commit -m "Configure AP European History draft metadata and MCQ skills"
          git push origin HEAD:subject/ap-european-history
