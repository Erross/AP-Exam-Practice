name: AP Chemistry Certified Transfer
on:
  push:
    branches: [subject/ap-chemistry]
    paths: [.github/workflows/apchem-certified-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22}
      - run: npm ci
      - name: Transplant certified Chemistry-only delta
        run: |
          git fetch origin ea674995f736357c3d71e07cab5f468d99719837
          git checkout ea674995f736357c3d71e07cab5f468d99719837 -- \
            data/ap-chemistry-corrections.js \
            data/ap-chemistry-quality-fixes.js \
            tests/ap-chemistry-naive-argumentation-regressions.test.js \
            tests/ap-chemistry-naive-audit-regressions.test.js \
            tests/ap-chemistry-practice4-quantitative-audit.test.js \
            tests/ap-chemistry-quality-fixes.test.js \
            tests/ap-chemistry.test.js
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/helpers.js'); s=p.read_text()
          old='  vm.runInContext(fs.readFileSync("data/ap-chemistry-corrections.js", "utf8"), sandbox);\n  return sandbox.window.QUESTIONS_AP_CHEMISTRY;'
          new='  vm.runInContext(fs.readFileSync("data/ap-chemistry-corrections.js", "utf8"), sandbox);\n  vm.runInContext(fs.readFileSync("data/ap-chemistry-quality-fixes.js", "utf8"), sandbox);\n  return sandbox.window.QUESTIONS_AP_CHEMISTRY;'
          if old not in s: raise SystemExit('Chemistry helper insertion point missing')
          p.write_text(s.replace(old,new))
          p=Path('index.html'); s=p.read_text()
          old='<script src="data/ap-chemistry-corrections.js"></script>\n<script src="data/ap-environmental-science.js"></script>'
          new='<script src="data/ap-chemistry-corrections.js"></script>\n<script src="data/ap-chemistry-quality-fixes.js"></script>\n<script src="data/ap-environmental-science.js"></script>'
          if old not in s: raise SystemExit('Chemistry browser insertion point missing')
          p.write_text(s.replace(old,new))
          PY
          rm -f .github/workflows/apchem-certified-transfer.yml
      - name: Verify Chemistry stays draft
        run: |
          node - <<'NODE'
          const s=require('./js/subjects').AP_SUBJECTS.find(x=>x.id==='ap-chemistry');
          if(!s||s.releaseStatus!=='draft') throw new Error(`Chemistry releaseStatus=${s&&s.releaseStatus}`);
          console.log('CHEMISTRY_RELEASE_STATUS',s.releaseStatus);
          NODE
      - name: Full repository validation
        run: npm run check
      - name: Commit certified Chemistry state
        run: |
          git config user.name "Erross"
          git config user.email "33665337+Erross@users.noreply.github.com"
          git add -A
          git commit -m "Apply independently certified Chemistry audit fixes"
          git push origin HEAD:subject/ap-chemistry
