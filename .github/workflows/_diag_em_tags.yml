name: Diagnose EM Tags
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_diag_em_tags.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: node tools/_diag_em_tags.js
