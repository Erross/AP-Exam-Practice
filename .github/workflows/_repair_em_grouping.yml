name: Repair EM Stimulus Grouping
on:
  push:
    branches: [subject/ap-physics-c-em]
    paths: [.github/workflows/_repair_em_grouping.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: subject/ap-physics-c-em
      - run: python tools/_repair_em_grouping.py
      - name: Diagnose duplicate and length outliers
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');const sb={window:{}};vm.createContext(sb);vm.runInContext(fs.readFileSync('data/ap-physics-c-em.js','utf8'),sb);const b=sb.window.QUESTIONS_AP_PHYSICS_C_EM;
          const q=b.find(x=>x.id==='em-8.6-02'); console.log('DUPLICATE_ITEM',JSON.stringify({o:q.o,c:q.c}));
          const wc=t=>t.trim().split(/\s+/).length;
          const rows=b.map(q=>{const c=wc(q.o[q.c[0]]),d=q.o.filter((_,i)=>i!==q.c[0]).map(wc);return {id:q.id,delta:c-d.reduce((a,x)=>a+x,0)/3,correct:q.o[q.c[0]],distractors:q.o.filter((_,i)=>i!==q.c[0])}}).sort((a,b)=>b.delta-a.delta).slice(0,15);
          console.log('LENGTH_OUTLIERS',JSON.stringify(rows));
          NODE
      - run: rm tools/_repair_em_grouping.py .github/workflows/_repair_em_grouping.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore E&M atomic stimulus grouping"
          git push origin HEAD:subject/ap-physics-c-em
