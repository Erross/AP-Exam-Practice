<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AP Exam Practice</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <h1>AP Exam Practice</h1>
  <p class="tagline">Free, timed, unofficial practice exams for every standard AP subject.</p>
</header>

<!-- ============ SPLASH / CATALOG SCREEN ============ -->
<main id="screen-catalog" class="screen active">
  <div class="catalog-toolbar">
    <input type="search" id="catalog-search" placeholder="Search subjects…" aria-label="Search subjects" />
  </div>
  <div id="catalog-categories"></div>
</main>

<!-- ============ EXAM SCREEN ============ -->
<main id="screen-exam" class="screen">
  <div class="exam-topbar">
    <button type="button" id="exam-back-btn" class="link-btn">← Exit</button>
    <span id="exam-subject-name" class="exam-subject-name"></span>
    <span id="timer" class="timer">0:00</span>
  </div>

  <div class="exam-body">
    <div class="question-panel">
      <p id="question-position" class="question-position"></p>
      <div id="question-body"></div>
      <div class="question-controls">
        <button type="button" id="prev-btn">← Previous</button>
        <button type="button" id="flag-btn">🚩 Flag for review</button>
        <button type="button" id="next-btn">Next →</button>
      </div>
    </div>

    <aside class="navigator-panel">
      <h2>Questions</h2>
      <div id="navigator-grid" class="navigator-grid"></div>
      <ul class="navigator-legend">
        <li><span class="legend-swatch answered"></span> Answered</li>
        <li><span class="legend-swatch flagged"></span> Flagged</li>
        <li><span class="legend-swatch current"></span> Current</li>
      </ul>
      <button type="button" id="submit-btn" class="submit-btn">Submit Exam</button>
    </aside>
  </div>
</main>

<!-- ============ RESULTS SCREEN ============ -->
<main id="screen-results" class="screen">
  <h2 id="results-subject-name"></h2>
  <p id="results-score" class="results-score"></p>
  <p id="results-scope-note" class="results-scope-note"></p>

  <h3>Per-unit breakdown</h3>
  <table class="results-table">
    <thead><tr><th>Unit</th><th>Score</th></tr></thead>
    <tbody id="results-unit-table"></tbody>
  </table>

  <h3>Answer review</h3>
  <div id="results-review" class="results-review"></div>

  <button type="button" id="results-back-btn">← Back to subjects</button>
</main>
